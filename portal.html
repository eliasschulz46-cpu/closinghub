<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Auftraggeber-Portal · ClosingHub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230E1A2B%22/%3E%3Ctext x=%2232%22 y=%2248%22 text-anchor=%22middle%22 font-family=%22Arial Black,Arial%22 font-weight=%22900%22 font-size=%2246%22 fill=%22%23ffffff%22%3EH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Parisienne&family=Bebas+Neue&display=swap">
<style>
  :root{--bg:#0A0A0B;--bg2:#111113;--card:#141416;--line:#232327;--fg:#F5F5F5;--muted:#8B8B93;--gold:#D4A843;--grad:linear-gradient(135deg,#F3D58A,#D4A843 50%,#A97C22);--ok:#5FBF7A;--warn:#E0A84A;--bad:#E06A6A}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5}
  a{color:inherit;text-decoration:none}
  button,input,select,textarea{font:inherit;color:inherit}
  .gold{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .muted{color:var(--muted)}
  .logo{display:inline-flex;align-items:baseline;white-space:nowrap;line-height:1;font-size:24px}
  .logo .l1{font-family:Parisienne,cursive;margin-right:.08em}
  .logo .l2{font-family:'Bebas Neue',sans-serif;font-size:1.12em;letter-spacing:.01em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

  .top{position:sticky;top:0;z-index:30;height:60px;display:flex;align-items:center;gap:16px;padding:0 20px;background:rgba(10,10,11,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .top .tag{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line);padding-left:14px}
  .top .sp{flex:1}
  .top .search{width:260px;max-width:30vw}
  .layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 60px)}
  .side{border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
  .side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500;transition:background .15s,color .15s}
  .side a:hover{background:var(--bg2);color:var(--fg)}
  .side a.on{background:#1a1710;color:var(--fg)}
  .side a.on svg{color:var(--gold)}
  .side .grp{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#5d5d64;margin:16px 12px 6px}
  .side .bdg{margin-left:auto;font-size:11px;background:var(--gold);color:#111;border-radius:99px;padding:0 7px;font-weight:700}
  .main{padding:26px 28px 60px;min-width:0}
  .h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:2px 0 20px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .between{justify-content:space-between}
  .grid{display:grid;gap:14px}
  .g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .card h3{font-size:14px;font-weight:600;margin-bottom:12px}
  .kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font-size:28px;font-weight:700;margin-top:4px;letter-spacing:-.02em} .kpi .s{font-size:12px;margin-top:2px;color:var(--muted)}
  .up{color:var(--ok)} .down{color:var(--bad)}
  .btn{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--bg2);transition:border-color .15s,transform .1s}
  .btn:hover{border-color:var(--gold)} .btn:active{transform:scale(.97)}
  .btn.gold-b{background:var(--grad);color:#111;border:0}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn.red:hover{border-color:var(--bad);color:var(--bad)}
  .in,select.in,textarea.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none}
  .in:focus{border-color:var(--gold)}
  label.f{display:grid;gap:5px;font-size:12px;color:var(--muted)}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
  td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#17171a}
  .tw{overflow-x:auto;padding:0}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
  .p-ok{color:var(--ok);border-color:#2c4a34} .p-warn{color:var(--warn);border-color:#4d3d22} .p-bad{color:var(--bad);border-color:#F3C9C4} .p-gold{color:var(--gold);border-color:#4a3c1c}
  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .tabs button{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 14px;cursor:pointer;color:var(--muted);font-weight:500}
  .tabs button.on{border-color:var(--gold);color:var(--fg);background:#1a1710}
  .bar{height:8px;border-radius:9px;background:#1f1f23;overflow:hidden} .bar i{display:block;height:100%;background:var(--grad);border-radius:9px}
  .item{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)} .item:first-child{border-top:0}
  .ico{width:36px;height:36px;border-radius:50%;border:1px solid #3a3222;display:grid;place-items:center;flex:none;color:var(--gold)}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .demo{font-size:12px;color:var(--warn);border:1px dashed #4d3d22;border-radius:10px;padding:8px 12px;margin-bottom:18px}
  .switch{position:relative;width:38px;height:22px;flex:none;cursor:pointer}
  .switch input{opacity:0;width:0;height:0}
  .switch span{position:absolute;inset:0;background:#2a2a2f;border-radius:99px;transition:.2s}
  .switch span:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .switch input:checked+span{background:var(--gold)} .switch input:checked+span:before{transform:translateX(16px)}
  .ticker{height:38px;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;background:var(--bg2);display:flex;align-items:center}
  .ticker .lab{position:relative;z-index:2;padding:0 12px;height:100%;display:flex;align-items:center;background:var(--bg2);color:var(--gold);font-weight:600;font-size:12px;border-right:1px solid var(--line)}
  .ticker .track{display:flex;gap:40px;white-space:nowrap;animation:run 30s linear infinite;padding-left:20px;font-size:13px}
  .ticker .track b{color:var(--gold);font-weight:600}
  @keyframes run{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .chat{display:flex;flex-direction:column;gap:10px;max-height:380px;overflow:auto;padding:4px}
  .msg{max-width:78%;padding:10px 14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
  .msg.me{align-self:flex-end;background:#1a1710;border-color:#3a3222}
  .msg small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
  .list-sel{cursor:pointer;padding:12px;border-radius:12px;border:1px solid transparent}
  .list-sel:hover{background:var(--bg2)} .list-sel.on{border-color:var(--gold);background:#1a1710}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
  .modal.open{display:flex}
  .modal .card{width:100%;max-width:560px;max-height:88vh;overflow:auto}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card);border:1px solid var(--gold);padding:10px 18px;border-radius:12px;transition:transform .3s;z-index:70}
  .toast.show{transform:translateX(-50%) translateY(0)}
  svg{flex:none}
  .chart text{fill:var(--muted);font-size:11px}
  .supg{grid-template-columns:320px 1fr}.dashg{grid-template-columns:1.6fr 1fr}
  @media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
  @media(max-width:820px){
    .layout{grid-template-columns:1fr}
    .side{position:sticky;top:60px;height:auto;display:flex;gap:4px;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line);background:var(--bg);z-index:20}
    .side .grp{display:none} .side a{white-space:nowrap;padding:8px 12px}
    .main{padding:18px 14px 50px} .g2,.g3,.supg,.dashg{grid-template-columns:1fr} .top .search,.top .tag{display:none}
  }
  @media(max-width:480px){.g4{grid-template-columns:1fr 1fr}.kpi .v{font-size:22px}}
  @media print{.top,.side,.no-print{display:none!important}}

  /* Logo-Animation: Linien von „closing“ leuchten nach und nach auf wie ein LED-Band (≈6 s) */
  .l1{position:relative;display:inline-block}
  .l1 .ink{display:inline-block;opacity:.38}
  .light .l1 .ink{opacity:1}
  .l1 .glow{position:absolute;left:0;top:0;pointer-events:none;color:#fff;
    text-shadow:0 0 1px #fff,0 0 2px rgba(255,255,255,.95),0 0 5px rgba(255,255,255,.6);
    clip-path:inset(-60% -25% -70% -15%)}
  .play .l1 .glow{animation:chGlow 6s linear .3s both}
  @keyframes chGlow{
    0%{clip-path:inset(-60% 100% -70% -15%)} 10%{clip-path:inset(-60% 97% -70% -15%)} 30%{clip-path:inset(-60% 72% -70% -15%)}
    50%{clip-path:inset(-60% 50% -70% -15%)} 70%{clip-path:inset(-60% 28% -70% -15%)} 88%{clip-path:inset(-60% 8% -70% -15%)}
    100%{clip-path:inset(-60% -25% -70% -15%)} }
  @keyframes chDot{
    0%{left:2%;top:18%;opacity:0;transform:translate(-50%,-50%) scale(.3)}
    5%{opacity:1;transform:translate(-50%,-50%) scale(1.25)} 10%{left:3%;top:22%;transform:translate(-50%,-50%) scale(1)}
    30%{left:28%;top:58%} 50%{left:50%;top:42%} 70%{left:72%;top:58%} 88%{left:92%;top:50%;opacity:1}
    100%{left:100%;top:50%;opacity:0;transform:translate(-50%,-50%) scale(.5)} }
  .light .l1 .glow{color:inherit;text-shadow:none}
  @media (prefers-reduced-motion:reduce){.play .l1 .glow{animation:none}}

  .lgi canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .lgi .lg-c{opacity:.38}
  .lgi .lg-lit{filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 3px rgba(255,255,255,.75))}
  .lgi .lg-head{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px #fff) drop-shadow(0 0 10px rgba(255,255,255,.75))}
  .lgi .lg-hub{opacity:.28}
  .lgi.hub-on .lg-hub{opacity:1;filter:brightness(1.3) saturate(1.25) drop-shadow(0 0 2px rgba(255,220,80,.95)) drop-shadow(0 0 7px rgba(255,205,50,.6)) drop-shadow(0 0 14px rgba(255,190,40,.3))}
  .light .lgi .lg-c{opacity:1;filter:brightness(.12)}
  .light .lgi canvas{display:none}
  .light .lgi .lg-hub{opacity:1!important;filter:none!important}
  details.rt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;background:var(--bg2)}
  details.rt summary{cursor:pointer;list-style:none;display:flex;align-items:center}
  details.rt summary::before{content:'▸';color:var(--gold);margin-right:10px;transition:transform .2s}
  details.rt[open] summary::before{transform:rotate(90deg)}
  .lgi .lg-c,.lgi .lg-hub{opacity:1 !important}
  .lgi .lg-hub{filter:brightness(1.15) saturate(1.15)}
</style>
<style id="vertrag-theme">
  /* ClosingHub Vertragsdesign: Papier, Tinte, Abschluss-Grün */
  :root{--bg:#F2F4F1;--bg2:#F7F8F6;--card:#FFFFFF;--line:#E1E5DF;--fg:#0E1A2B;--muted:#5B6576;--gold:#087A4B;--grad:#087A4B;--ok:#087A4B;--warn:#A15C07;--bad:#B42318;
    --ink:#0E1A2B;--deal:#087A4B;--deal-press:#06603B;--deal-soft:#E3F1EA;--pen:#1F3FBF;--seal:#B8860B;--navy-line:#22324A;--navy-text:#C9D3E3}
  html,body{font-family:Archivo,system-ui,sans-serif;font-size:14.5px;-webkit-font-smoothing:antialiased}
  .gold{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--deal)}
  .logo{color:var(--ink)}
  .logo .l1{font-family:Parisienne,cursive}
  .logo .l2{font-family:"Bebas Neue",sans-serif;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--ink)}
  .top{background:rgba(255,255,255,.92);border-bottom:1px solid var(--line)}
  .top .tag{color:var(--muted);letter-spacing:.04em;text-transform:none;font-size:13px;font-weight:600}
  .side{background:var(--bg)}
  .side a{color:#3B4657;font-weight:600}
  .side a:hover{background:#E8ECE6;color:var(--ink)}
  .side a.on{background:var(--ink);color:#fff}
  .side a.on svg{color:#7FD1A8}
  .side .grp{color:#7A8494;letter-spacing:.04em;text-transform:none;font-size:12px;font-weight:700}
  .side .bdg{background:var(--deal);color:#fff}
  .side a.on .bdg{background:#fff;color:var(--ink)}
  .h1{font-weight:900;font-variation-settings:"wdth" 80;font-size:30px;letter-spacing:-.005em;line-height:1.05}

  :focus-visible{outline:2px solid var(--pen);outline-offset:2px}
  @media(max-width:820px){.side{background:var(--bg)}}
</style>

</head>
<body>
<div class="top">
  <a href="#dashboard" class="logo" style="font-size:24px"><span class="l1">closing</span><span class="l2">HUB</span></a>
  <span class="tag">Auftraggeber-Portal</span>
  <span class="sp"></span>
  <span class="muted" id="who" style="font-size:13px"></span>
  <button class="btn sm" id="outBtn" onclick="logout()" style="display:none">Abmelden</button>
</div>
<div class="layout">
  <nav class="side" id="side"></nav>
  <main class="main" id="main"></main>
</div>
<div class="modal" id="modal"><div class="card" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>
const I = {
  dash:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  jobs:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',
  invoice:'<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h6M9 17h6"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'
};
const ic = (n,s=18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;

/* ===== Verbindung ===== */
const SB_URL = 'https://bzcnqggwyfocpbkwqhsy.supabase.co';
const SB_KEY = 'sb_publishable_97FHvL7dI_g9ueRVwfhE6A_qv07CJ6D';
const SKEY = 'ch_portal_session';
let SESSION = null; try{ SESSION = JSON.parse(localStorage.getItem(SKEY)); }catch(e){}
const keep = s => { SESSION = s; try{ s ? localStorage.setItem(SKEY, JSON.stringify(s)) : localStorage.removeItem(SKEY); }catch(e){} };
function takeSession(j){ keep({ access_token:j.access_token, refresh_token:j.refresh_token, expires_at:j.expires_at || (Date.now()/1000 + (j.expires_in||3600)), email:j.user&&j.user.email, uid:j.user&&j.user.id, meta:(j.user&&j.user.user_metadata)||{} }); }
async function authCall(path, body){
  const r = await fetch(`${SB_URL}/auth/v1/${path}`, { method:'POST', headers:{ apikey:SB_KEY, 'Content-Type':'application/json' }, body:JSON.stringify(body) });
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description || j.msg || j.message || 'Das hat nicht geklappt');
  return j;
}
async function refresh(){ takeSession(await authCall('token?grant_type=refresh_token', { refresh_token:SESSION.refresh_token })); }
async function api(path, { method='GET', body, prefer } = {}, retry=true){
  if(SESSION && SESSION.expires_at - 60 < Date.now()/1000){ try{ await refresh(); }catch(e){ logout(); throw e; } }
  const headers = { apikey:SB_KEY, 'Content-Type':'application/json' };
  if(SESSION) headers.Authorization = 'Bearer ' + SESSION.access_token;
  if(prefer) headers.Prefer = prefer;
  const r = await fetch(`${SB_URL}/rest/v1/${path}`, { method, headers, body: body!==undefined ? JSON.stringify(body) : undefined });
  if(r.status===401 && retry && SESSION){ try{ await refresh(); return api(path, { method, body, prefer }, false); }catch(e){ logout(); throw e; } }
  if(!r.ok){ const j = await r.json().catch(()=>({})); throw new Error(j.message || ('Fehler ' + r.status)); }
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
const q = (p, o) => api(p, o).catch(e => { toast('⚠️ ' + e.message); throw e; });
function logout(){ keep(null); ME=null; LOADED=false; render(); }

/* ===== Helfer ===== */
const eur = n => (+n).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);
const dt = iso => new Date(iso).toLocaleDateString('de-DE');
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),2800); }
function openModal(html){ $('mbox').innerHTML=html; $('modal').classList.add('open'); }
function closeModal(){ $('modal').classList.remove('open'); }
$('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
const ST = { anfrage:['In Prüfung','p-gold'], entwurf:['In Prüfung','p-gold'], freigabe:['Bitte prüfen & veröffentlichen','p-gold'], live:['Online','p-ok'], beendet:['Beendet',''], abgelehnt:['Abgelehnt','p-bad'] };
const INV = { bezahlt:'p-ok', offen:'p-warn', 'überfällig':'p-bad', einbehalten:'p-gold' };
const pill = (t,c='') => `<span class="pill ${c}">${esc(t)}</span>`;
const gross = i => (+i.net)*(1+(+i.vat)/100);
const days = j => j.expires_at ? Math.max(0, Math.ceil((new Date(j.expires_at)-Date.now())/864e5)) : null;

/* ===== Daten ===== */
let ME=null, JOBS=[], INVS=[], PRICES={unlock:25,topJob:19,jobFee:0,vat:21}, LOADED=false;
const fee = k => { const m={fee_job:'jobFee',fee_top:'topJob',fee_unlock:'unlock'}; return (ME && ME[k]!==null && ME[k]!==undefined) ? +ME[k] : +PRICES[m[k]]||0; };
async function loadAll(){
  let rows = await q(`clients?select=*&user_id=eq.${SESSION.uid}`);
  if(!rows.length){
    const m=SESSION.meta||{};
    rows = await q('clients',{ method:'POST', prefer:'return=representation', body:{ user_id:SESSION.uid, firma:(m.firma||'Meine Firma').slice(0,160), kontakt_name:m.name||null, email:SESSION.email||null } });
  }
  ME = rows[0];
  const [jobs, invs, st] = await Promise.all([
    q(`jobs?select=*&client_id=eq.${ME.id}&order=created_at.desc`),
    q(`invoices?select=*&client_id=eq.${ME.id}&order=created_at.desc`),
    api('settings?select=key,value&key=eq.preise').catch(()=>[])
  ]);
  JOBS=jobs; INVS=invs; if(st[0]) PRICES={...PRICES,...st[0].value};
  LOADED=true;
}

/* ===== Login & Registrierung ===== */
let authMode='login';
function authView(){
  const reg = authMode==='register';
  return `<div style="max-width:420px;margin:6vh auto" class="card">
    <div style="text-align:center;margin-bottom:16px"><span class="logo" style="font-size:36px"><span class="l1">closing</span><span class="l2">HUB</span></span>
      <div class="muted" style="font-size:11px;letter-spacing:.25em;text-transform:uppercase;margin-top:6px">Auftraggeber-Portal</div></div>
    <div class="tabs" style="justify-content:center"><button class="${reg?'':'on'}" onclick="authMode='login';render()">Anmelden</button><button class="${reg?'on':''}" onclick="authMode='register';render()">Registrieren</button></div>
    <form id="af" class="grid" style="gap:12px" novalidate>
      ${reg?`<label class="f">Firma<input class="in" id="aFirma" autocomplete="organization" required></label>
      <label class="f">Dein Name<input class="in" id="aName" autocomplete="name" required></label>`:''}
      <label class="f">E-Mail<input class="in" id="aMail" type="email" autocomplete="username" required></label>
      <label class="f">Passwort${reg?' (mind. 8 Zeichen)':''}<input class="in" id="aPw" type="password" autocomplete="${reg?'new-password':'current-password'}" required></label>
      ${reg?`<label style="display:flex;gap:8px;font-size:12.5px;color:var(--muted);align-items:flex-start"><input type="checkbox" id="aOk" style="margin-top:3px"><span>Ich akzeptiere die AGB und die Datenschutzerklärung von ClosingHub.</span></label>`:''}
      <p id="aErr" class="down" style="display:none;font-size:13px"></p>
      <p id="aOkMsg" class="up" style="display:none;font-size:13px"></p>
      <button class="btn gold-b" style="justify-content:center;padding:11px">${reg?'Kostenlos registrieren':'Anmelden'}</button>
    </form>
    <p class="muted" style="font-size:12.5px;text-align:center;margin-top:14px">${reg?'Die Registrierung ist kostenlos. Du zahlst nur für veröffentlichte Jobs und freigeschaltete Kandidaten.':'Noch kein Konto? Klick oben auf „Registrieren“.'}</p></div>`;
}
document.addEventListener('submit', async e=>{
  if(e.target.id!=='af') return; e.preventDefault();
  const err=$('aErr'), ok=$('aOkMsg'), b=e.target.querySelector('button.gold-b'); err.style.display='none'; ok.style.display='none';
  const fail=m=>{ err.textContent=m; err.style.display='block'; };
  const email=$('aMail').value.trim(), pw=$('aPw').value;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return fail('Bitte gib eine gültige E-Mail-Adresse ein.');
  const label=b.textContent; b.disabled=true; b.textContent='Einen Moment …';
  try{
    if(authMode==='register'){
      const firma=$('aFirma').value.trim(), name=$('aName').value.trim();
      if(!firma||!name){ fail('Bitte Firma und Namen ausfüllen.'); return; }
      if(pw.length<8){ fail('Das Passwort braucht mindestens 8 Zeichen.'); return; }
      if(!$('aOk').checked){ fail('Bitte akzeptiere AGB und Datenschutzerklärung.'); return; }
      const j = await authCall('signup',{ email, password:pw, data:{ firma, name, rolle:'auftraggeber' } });
      if(j.access_token){ takeSession(j); LOADED=false; render(); }
      else { ok.textContent='Fast geschafft! Wir haben dir eine E-Mail geschickt. Bestätige den Link darin und melde dich danach hier an.'; ok.style.display='block'; }
    } else {
      takeSession(await authCall('token?grant_type=password',{ email, password:pw })); LOADED=false; render();
    }
  }catch(x){
    const m=String(x.message||'');
    fail(/invalid login/i.test(m)?'E-Mail oder Passwort falsch.':/not confirmed/i.test(m)?'Bitte bestätige zuerst den Link in der E-Mail, die wir dir geschickt haben.':/already registered|already been registered/i.test(m)?'Mit dieser E-Mail gibt es schon ein Konto. Bitte melde dich an.':/signups? not allowed|disabled/i.test(m)?'Die Registrierung ist gerade geschlossen. Bitte melde dich bei uns.':m);
  }finally{ if(b.isConnected){ b.disabled=false; b.textContent=label; } }
});

/* ===== Navigation ===== */
const NAV=[['dashboard','Dashboard','dash'],['jobs','Stellenangebote','jobs'],['rechnungen','Rechnungen','invoice'],['profil','Firmenprofil','user']];
const route = () => (location.hash.slice(1)||'dashboard').split('?')[0];
function drawNav(){ const r=route(); $('side').innerHTML = NAV.map(n=>`<a href="#${n[0]}" class="${r===n[0]?'on':''}">${ic(n[2])}<span>${n[1]}</span>${n[0]==='rechnungen'&&INVS.some(i=>i.status==='offen'||i.status==='überfällig')?`<span class="bdg">${INVS.filter(i=>i.status==='offen'||i.status==='überfällig').length}</span>`:''}</a>`).join(''); }
const closedNote = () => ME.status!=='aktiv' ? `<div class="demo" style="color:var(--bad);border-color:#F3C9C4">Dein Konto ist ${ME.status==='gesperrt'?'gesperrt':'gekündigt'}. Du kannst deine Daten und Rechnungen weiter einsehen, aber keine neuen Jobs einreichen. Bei Fragen: info@getclosinghub.com</div>` : '';

/* ===== Dashboard ===== */
function dashboard(){
  const live=JOBS.filter(j=>j.status==='live'), pend=JOBS.filter(j=>j.status==='anfrage'||j.status==='entwurf'||j.status==='freigabe');
  const open=INVS.filter(i=>i.status==='offen'||i.status==='überfällig'), paid=INVS.filter(i=>i.status==='bezahlt');
  const kpi=(l,v,s='',c='')=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s ${c}">${s}</div></div>`;
  const soon=live.filter(j=>days(j)!==null&&days(j)<=7);
  const h=new Date().getHours(), greet=h<11?'Guten Morgen':h<18?'Hallo':'Guten Abend';
  return `<div class="row between"><div><h1 class="h1">${greet}${ME.kontakt_name?', '+esc(ME.kontakt_name.split(' ')[0]):''}</h1><p class="sub">${esc(ME.firma)} · Kunde seit ${dt(ME.created_at)}</p></div>
    ${ME.status==='aktiv'?`<button class="btn gold-b" onclick="jobForm()">${ic('plus',15)} Stellenangebot einreichen</button>`:''}</div>
  ${closedNote()}
  ${ME.status==='aktiv'?JOBS.filter(j=>j.status==='freigabe').map(j=>`<div class="card" style="border-color:var(--gold);margin-bottom:14px"><div class="row between"><div><b class="gold">Deine Anzeige ist bereit</b><div style="margin-top:2px">${esc(j.titel||'Stellenangebot')}</div><div class="muted" style="font-size:12.5px">Bitte kurz prüfen. Danach kannst du sie mit einem Klick veröffentlichen.</div></div><button class="btn gold-b" onclick="reviewJob(${j.id})">Anzeige prüfen & veröffentlichen</button></div></div>`).join(''):''}
  <div class="grid g4">
    ${kpi('Jobs online', live.length, soon.length?soon.length+' laufen bald aus':'alles im grünen Bereich', soon.length?'down':'')}
    ${kpi('In Prüfung', pend.length, JOBS.some(j=>j.status==='freigabe')?JOBS.filter(j=>j.status==='freigabe').length+' warten auf deine Freigabe':'wir melden uns per E-Mail', JOBS.some(j=>j.status==='freigabe')?'gold':'')}
    ${kpi('Offene Rechnungen', eur(open.reduce((a,i)=>a+gross(i),0)), open.length+' offen', open.length?'down':'')}
    ${kpi('Bisher bezahlt', eur(paid.reduce((a,i)=>a+gross(i),0)), paid.length+' Rechnungen')}
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><div class="row between"><h3>Deine Stellenangebote</h3><a href="#jobs" class="gold" style="font-size:13px">Alle ansehen →</a></div>
      ${JOBS.slice(0,5).map(j=>`<div class="item" style="padding:10px 0"><div style="flex:1"><b>${esc(j.titel||'Neue Anfrage')}</b><div class="muted" style="font-size:12px">${esc([j.rolle,j.provision,j.region].filter(Boolean).join(' · ')||'eingereicht am '+dt(j.created_at))}</div></div>
        <div style="text-align:right">${pill(...ST[j.status])}${j.status==='live'&&days(j)!==null?`<div class="muted" style="font-size:11px;margin-top:3px">noch ${days(j)} Tage</div>`:''}</div></div>`).join('')||`<p class="muted">Du hast noch kein Stellenangebot eingereicht. Leg direkt los – wir prüfen es und veröffentlichen es anonym für geprüfte Closer und Setter.</p>`}</div>
    <div class="card"><h3>Deine Konditionen</h3>
      ${[['Veröffentlichung pro Job',fee('fee_job')],['Aufpreis Top-Job (oben, gold markiert)',fee('fee_top')],['Freischaltung pro Kandidat',fee('fee_unlock')]].map(([l,v])=>`<div class="row between" style="padding:9px 0;border-top:1px solid var(--line)"><span>${l}</span><b class="gold">${v>0?eur(v):'kostenlos'}</b></div>`).join('')}
      <p class="muted" style="font-size:12px;margin-top:10px">Alle Preise netto zzgl. ${PRICES.vat} % IVA. Kein Abo, keine Grundgebühr.</p>
      <h3 style="margin-top:18px">So läuft's ab</h3>
      ${['Du reichst dein Stellenangebot ein.','Wir prüfen es und bereiten es auf (meist innerhalb von 24 Stunden).','Dein Job geht anonym online, Bewerbungen kommen über ClosingHub.','Du schaltest nur die Kandidaten frei, die dich überzeugen.'].map((t,i)=>`<div class="row" style="padding:5px 0;align-items:flex-start;flex-wrap:nowrap"><span class="pill p-gold">${i+1}</span><span style="font-size:13px">${t}</span></div>`).join('')}</div>
  </div>`;
}

/* ===== Stellenangebote ===== */
const FIELDS=[
  ['rolle','Wen suchst du?','select',['Closer','Setter','Closer & Setter']],
  ['branche','Branche','text','z. B. Coaching, Solar, Software'],
  ['produkt','Produkt / Angebot','text','Was wird verkauft?'],
  ['ticket','Preis des Produkts','text','z. B. 3.000–8.000 €'],
  ['provision','Provision','text','z. B. 10 % pro Abschluss'],
  ['fixum','Fixum (optional)','text','z. B. 1.500 € / Monat'],
  ['modell','Arbeitsmodell','select',['Remote','Vor Ort','Hybrid']],
  ['region','Region','text','z. B. DACH'],
  ['umfang','Umfang','text','z. B. Freelance, ca. 20 Std./Woche'],
  ['start_text','Start','text','z. B. ab sofort'],
  ['auftragsdauer','Wie lange?','text','z. B. 3 Monate oder unbefristet'],
];
function jobsPage(){
  return `<div class="row between"><div><h1 class="h1">Stellenangebote</h1><p class="sub">Reiche Jobs ein und verfolge ihren Status. Wir bereiten jede Anzeige auf, du prüfst sie und veröffentlichst sie selbst.</p></div>
    ${ME.status==='aktiv'?`<button class="btn gold-b" onclick="jobForm()">${ic('plus',15)} Neues Stellenangebot</button>`:''}</div>${closedNote()}
  <div class="grid">${JOBS.map(j=>`<div class="card"><div class="row between"><div class="row"><b style="font-size:16px">${esc(j.titel||'Neue Anfrage')}</b>${j.top?pill('★ Top-Job','p-gold'):j.top_wunsch?pill('★ Top-Job gebucht','p-gold'):''}</div>${pill(...ST[j.status])}</div>
    <div class="row" style="margin-top:8px;gap:6px">${[j.rolle,j.provision,j.region,j.modell,j.umfang].filter(Boolean).map(x=>pill(x)).join('')}</div>
    ${j.beschreibung||j.anfrage_text?`<p class="muted" style="margin-top:10px;white-space:pre-wrap;max-height:90px;overflow:hidden">${esc(j.beschreibung||j.anfrage_text)}</p>`:''}
    <div class="row between" style="margin-top:12px"><span class="muted" style="font-size:12px">Eingereicht am ${dt(j.created_at)}${j.status==='live'?` · online seit ${dt(j.published_at)}${days(j)!==null?` · noch ${days(j)} Tage`:''}`:''}${j.status==='abgelehnt'?' · Bei Fragen melde dich gern bei uns.':''}</span>
      ${j.status==='freigabe'&&ME.status==='aktiv'?`<button class="btn gold-b sm" onclick="reviewJob(${j.id})">Prüfen & veröffentlichen</button>`:j.status==='anfrage'&&ME.status==='aktiv'?`<button class="btn sm" onclick="jobForm(${j.id})">${ic('pen',13)} Bearbeiten</button>`:j.status==='live'||j.status==='beendet'?`<button class="btn sm" onclick="jobForm(0,${j.id})">Als Vorlage nutzen</button>`:''}</div></div>`).join('')
    ||`<div class="card empty">Noch keine Stellenangebote. Klick oben rechts auf „Neues Stellenangebot“.</div>`}</div>`;
}
function reviewJob(id){
  const j=JOBS.find(x=>x.id===id); if(!j) return;
  const cost=fee('fee_job') + (j.top ? (j.kosten_top!==null&&j.kosten_top!==undefined ? +j.kosten_top : fee('fee_top')) : 0);
  const unl=(j.kosten_freischaltung!==null&&j.kosten_freischaltung!==undefined)?+j.kosten_freischaltung:fee('fee_unlock');
  const rows=[['Gesucht',j.rolle],['Branche',j.branche],['Produkt',j.produkt],['Preis des Produkts',j.ticket],['Provision',j.provision],['Fixum',j.fixum],['Arbeitsmodell',j.modell],['Region',j.region],['Umfang',j.umfang],['Start',j.start_text],['Dauer',j.auftragsdauer]].filter(r=>r[1]);
  openModal(`<h3 style="font-size:18px">Anzeige prüfen</h3>
  <p class="muted" style="font-size:13px;margin:4px 0 14px">So erscheint dein Stellenangebot in der Jobbörse. Dein Firmenname bleibt für Bewerber anonym.</p>
  <div style="border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--bg2)">
    <div class="row" style="gap:8px">${j.top?pill('★ Top-Job','p-gold'):''}${pill(j.rolle||'Closer')}</div>
    <div style="font-size:18px;font-weight:700;margin-top:8px">${esc(j.titel||'Stellenangebot')}</div>
    <p style="margin-top:8px;white-space:pre-wrap">${esc(j.beschreibung||'')}</p>
    <div class="grid g2" style="gap:6px 16px;margin-top:12px;font-size:13.5px">${rows.map(([l,v])=>`<div><span class="muted">${l}:</span> ${esc(v)}</div>`).join('')}</div>
    ${j.anforderungen?`<div style="margin-top:12px"><b style="font-size:13px">Das solltest du mitbringen</b><p class="muted" style="white-space:pre-wrap;margin-top:4px;font-size:13.5px">${esc(j.anforderungen)}</p></div>`:''}
    ${(j.fragen||[]).length?`<div style="margin-top:12px"><b style="font-size:13px">Fragen an Bewerber</b><ol class="muted" style="margin:4px 0 0 18px;font-size:13.5px">${j.fragen.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`:''}
  </div>
  <p class="muted" style="font-size:12.5px;margin-top:12px">Laufzeit: <b>${j.anzeige_tage||30} Tage</b> · Kosten bei Veröffentlichung: <b class="gold">${cost>0?eur(cost)+' netto':'kostenlos'}</b>${j.top?' (inkl. Top-Job)':''} · Freischaltung pro Kandidat: <b class="gold">${eur(unl)} netto</b></p>
  <label class="row" style="gap:10px;margin-top:12px;cursor:pointer;flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" id="rvOk" style="width:18px;height:18px;margin-top:2px;flex:none;accent-color:#087A4B"><span style="font-size:13.5px">Ich habe die Anzeige geprüft. Alle Angaben stimmen.</span></label>
  <div id="rvChg" style="display:none;margin-top:12px"><label class="f">Was soll geändert werden?<textarea class="in" id="rvNote" rows="3" maxlength="1000" placeholder="z. B. Provision ist 12 % statt 10 %"></textarea></label>
    <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn" onclick="$('rvChg').style.display='none';$('rvBtns').style.display=''">Zurück</button><button class="btn gold-b" onclick="changeJob(${j.id},this)">Änderung senden</button></div></div>
  <p id="rvErr" class="down" style="display:none;font-size:13px;margin-top:8px"></p>
  <div class="row" id="rvBtns" style="justify-content:flex-end;margin-top:14px"><button class="btn" onclick="closeModal()">Später</button><button class="btn" onclick="$('rvChg').style.display='';$('rvBtns').style.display='none';$('rvNote').focus()">Änderung anfragen</button><button class="btn gold-b" onclick="publishJob(${j.id},this)">Jetzt veröffentlichen</button></div>`);
}
const rvFail = m => { const e=$('rvErr'); e.textContent=m; e.style.display='block'; };
async function publishJob(id,b){
  if(!$('rvOk').checked) return rvFail('Bitte bestätige zuerst mit dem Häkchen, dass du die Anzeige geprüft hast.');
  b.disabled=true;
  try{ const r=await api('rpc/client_publish_job',{method:'POST',body:{p_id:id}}); Object.assign(JOBS.find(x=>x.id===id), r||{status:'live',published_at:new Date().toISOString()}); closeModal(); location.hash='jobs'; render(); toast('Veröffentlicht – dein Job ist jetzt online'); }
  catch(e){ b.disabled=false; rvFail('Fehler: '+e.message); }
}
async function changeJob(id,b){
  const n=$('rvNote').value.trim(); if(n.length<3) return rvFail('Bitte beschreib kurz, was geändert werden soll.');
  b.disabled=true;
  try{ const r=await api('rpc/client_job_change',{method:'POST',body:{p_id:id,p_note:n}}); Object.assign(JOBS.find(x=>x.id===id), r||{status:'entwurf'}); closeModal(); render(); toast('Danke – wir passen die Anzeige an und melden uns'); }
  catch(e){ b.disabled=false; rvFail('Fehler: '+e.message); }
}
function jobForm(id, copyId){
  const src = JOBS.find(x=>x.id===(id||copyId)) || { rolle:'Closer', modell:'Remote' };
  const fld=([k,l,t,o])=>`<label class="f">${l}${t==='select'?`<select class="in" data-j="${k}">${o.map(x=>`<option ${x===src[k]?'selected':''}>${x}</option>`).join('')}</select>`:`<input class="in" data-j="${k}" value="${esc(src[k]||'')}" placeholder="${o}">`}</label>`;
  const f=fee('fee_job'), ft=fee('fee_top');
  openModal(`<h3 style="font-size:18px">${id?'Stellenangebot bearbeiten':'Stellenangebot einreichen'}</h3>
  <p class="muted" style="font-size:13px;margin:4px 0 12px">Je genauer deine Angaben, desto schneller geht dein Job online. Dein Firmenname bleibt für Bewerber anonym.</p>
  <label class="f">Titel (optional)<input class="in" data-j="titel" value="${esc(id?src.titel||'':'')}" placeholder="z. B. High-Ticket Closer für Coaching-Angebot"></label>
  <div class="grid g2" style="gap:12px;margin-top:12px">${FIELDS.map(fld).join('')}</div>
  <div class="grid" style="gap:12px;margin-top:12px">
    <label class="f">Beschreibung des Jobs<textarea class="in" data-j="anfrage_text" rows="5" placeholder="Was ist die Aufgabe? Woher kommen die Leads? Was macht dein Angebot besonders?">${esc(src.anfrage_text||src.beschreibung||'')}</textarea></label>
    <label class="f">Das sollte die Person mitbringen<textarea class="in" data-j="anforderungen" rows="3" placeholder="z. B. 1 Jahr Erfahrung im High-Ticket-Closing">${esc(src.anforderungen||'')}</textarea></label>
  </div>
  <label class="card" style="display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:14px;cursor:pointer;border-color:var(--gold,#087A4B)">
    <input type="checkbox" id="jTop" ${src.top_wunsch||src.top?'checked':''} onchange="jobCost()" style="width:20px;height:20px;margin-top:2px;flex:none;accent-color:#087A4B">
    <span><b>★ Als Top-Job buchen <span class="gold">+ ${eur(ft)} netto</span></b><br><span class="muted" style="font-size:12.5px">Dein Job steht ganz oben in der Jobbörse und ist gold markiert. So sehen ihn die meisten Closer und Setter zuerst.</span></span></label>
  <p class="muted" style="font-size:12.5px;margin-top:12px">Kosten bei Veröffentlichung: <b class="gold" id="jCost" data-f="${f}" data-t="${ft}"></b> · Freischaltung pro Kandidat: <b class="gold">${eur(fee('fee_unlock'))} netto</b></p>
  <p id="jErr" class="down" style="display:none;font-size:13px;margin-top:8px"></p>
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" onclick="closeModal()">Abbrechen</button><button class="btn gold-b" onclick="saveJob(${id||0},this)">${id?'Änderungen speichern':'Zur Prüfung einreichen'}</button></div>`);
  jobCost();
}
function jobCost(){ const e=$('jCost'); if(!e) return; const s=(+e.dataset.f)+($('jTop')&&$('jTop').checked?(+e.dataset.t):0); e.textContent = s>0 ? eur(s)+' netto' : 'kostenlos'; }
async function saveJob(id,b){
  const v={}; document.querySelectorAll('#mbox [data-j]').forEach(el=>{ const x=el.value.trim(); v[el.dataset.j]= x===''?null:x; });
  v.top_wunsch = !!($('jTop') && $('jTop').checked);
  const err=$('jErr'), fail=m=>{ err.textContent=m; err.style.display='block'; };
  if(!v.provision) return fail('Bitte gib die Provision an.');
  if(!v.anfrage_text || v.anfrage_text.length<30) return fail('Bitte beschreib den Job in ein paar Sätzen.');
  if(v.anfrage_text.length>4800) return fail('Die Beschreibung ist zu lang (max. 4.800 Zeichen).');
  b.disabled=true;
  try{
    const send = body => id ? api(`jobs?id=eq.${id}`,{method:'PATCH',prefer:'return=representation',body})
                            : api('jobs',{method:'POST',prefer:'return=representation',body:{...body,status:'anfrage',client_id:ME.id,firma:ME.firma,kontakt_name:ME.kontakt_name,kontakt_email:ME.email}});
    let res;
    try{ res = await send(v); }
    catch(e){ if(!/top_wunsch/.test(e.message)) throw e; const w={...v}; delete w.top_wunsch; if(v.top_wunsch) w.anfrage_text=(w.anfrage_text+'\n\n[Top-Job gewünscht]').slice(0,4990); res = await send(w); }
    const r=(res||[])[0];
    if(!r) throw new Error('Das Angebot konnte nicht gespeichert werden. Bitte lade die Seite neu und versuch es noch einmal.');
    if(id) Object.assign(JOBS.find(x=>x.id===id),r); else JOBS.unshift(r);
    closeModal(); location.hash='jobs'; render(); toast(id?'Gespeichert':'Eingereicht – wir prüfen dein Angebot');
  }catch(e){ b.disabled=false; fail('Fehler: '+e.message); }
}

/* ===== Rechnungen ===== */
function rechnungen(){
  const sum=sts=>INVS.filter(i=>sts.includes(i.status)).reduce((a,i)=>a+gross(i),0);
  return `<h1 class="h1">Rechnungen</h1><p class="sub">Alle Rechnungen zu deinen Jobs und Freischaltungen.</p>
  <div class="grid g3" style="margin-bottom:16px">
    <div class="card kpi"><div class="l">Offen</div><div class="v" style="color:var(--warn)">${eur(sum(['offen']))}</div></div>
    <div class="card kpi"><div class="l">Überfällig</div><div class="v down">${eur(sum(['überfällig']))}</div></div>
    <div class="card kpi"><div class="l">Bezahlt</div><div class="v up">${eur(sum(['bezahlt']))}</div></div></div>
  <div class="card tw"><table><thead><tr><th>Nr.</th><th>Datum</th><th>Leistung</th><th>Netto</th><th>Brutto</th><th>Status</th><th></th></tr></thead><tbody>
  ${INVS.map(i=>`<tr><td style="white-space:nowrap"><b>${esc(i.no)}</b></td><td class="muted">${dt(i.created_at)}</td><td>${esc(i.item)}</td><td class="muted">${eur(i.net)}</td><td><b>${eur(gross(i))}</b></td><td>${pill(i.status,INV[i.status]||'')}</td>
    <td style="text-align:right"><button class="btn sm" onclick="showInvoice(${i.id})">Ansehen / PDF</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Noch keine Rechnungen.</td></tr>'}
  </tbody></table></div>`;
}
function showInvoice(id){
  const i=INVS.find(x=>x.id===id);
  openModal(`<div id="invdoc" style="background:#fff;color:#111;border-radius:10px;padding:28px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start"><b style="font-size:22px;letter-spacing:-.01em">ClosingHub</b><div style="text-align:right;font-size:12px">Elias Schulz<br>Carrer de Julio Cortázar 18<br>07181 Calvià, Mallorca<br>NIF: X1847033P</div></div>
    <h2 style="margin:24px 0 4px;font-size:20px">Rechnung ${esc(i.no)}</h2><div style="font-size:12px;color:#666">Datum: ${dt(i.created_at)}</div>
    <div style="margin:18px 0;font-size:13px"><b>An:</b> ${esc(ME.firma)}<br>${esc(ME.rechnungsadresse||'').replace(/\n/g,'<br>')}${ME.ust_id?'<br>USt-ID: '+esc(ME.ust_id):''}</div>
    <table style="font-size:13px"><tr><th style="color:#666">Leistung</th><th style="color:#666;text-align:right">Betrag</th></tr>
      <tr><td style="border-color:#eee">${esc(i.item)}</td><td style="border-color:#eee;text-align:right">${eur(i.net)}</td></tr>
      <tr><td style="border-color:#eee">MwSt / IVA ${+i.vat} %</td><td style="border-color:#eee;text-align:right">${eur(i.net*i.vat/100)}</td></tr>
      <tr><td><b>Gesamt</b></td><td style="text-align:right"><b>${eur(gross(i))}</b></td></tr></table>
  </div>
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" onclick="closeModal()">Schließen</button><button class="btn gold-b" onclick="printInvoice()">Drucken / PDF</button></div>`);
}
function printInvoice(){
  const w=window.open('','_blank'); if(!w) return toast('Bitte Pop-ups erlauben');
  w.document.write(`<html><head><title>Rechnung</title><style>body{font-family:Inter,Arial,sans-serif;padding:30px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}</style></head><body>${$('invdoc').innerHTML}<script>setTimeout(()=>print(),400)<\/script></body></html>`);
  w.document.close();
}

/* ===== Firmenprofil ===== */
const PF=[['firma','Firma'],['kontakt_name','Ansprechpartner'],['telefon','Telefon'],['website','Website'],['land','Land'],['branche','Branche'],['ust_id','USt-ID / Steuernummer']];
function profil(){
  return `<h1 class="h1">Firmenprofil</h1><p class="sub">Diese Angaben nutzen wir für Rechnungen und Rückfragen. Bewerber sehen sie nicht.</p>${closedNote()}
  <div class="card" style="max-width:720px"><div class="grid g2" style="gap:12px">
    ${PF.map(([k,l])=>`<label class="f">${l}<input class="in" data-p="${k}" value="${esc(ME[k]||'')}"></label>`).join('')}
    <label class="f">E-Mail (Login)<input class="in" value="${esc(ME.email||SESSION.email||'')}" disabled></label></div>
    <label class="f" style="margin-top:12px">Rechnungsadresse<textarea class="in" data-p="rechnungsadresse" rows="3" placeholder="Straße, PLZ, Ort, Land">${esc(ME.rechnungsadresse||'')}</textarea></label>
    <div class="row between" style="margin-top:14px"><span class="muted" style="font-size:12.5px">Konto kündigen oder E-Mail ändern? Schreib an info@getclosinghub.com</span><button class="btn gold-b" onclick="saveProfil(this)">Speichern</button></div></div>`;
}
async function saveProfil(b){
  const v={}; document.querySelectorAll('[data-p]').forEach(el=>{ const x=el.value.trim(); v[el.dataset.p]= x===''?null:x; });
  if(!v.firma) return toast('Bitte den Firmennamen angeben');
  b.disabled=true; try{ await q(`clients?id=eq.${ME.id}`,{method:'PATCH',body:v}); Object.assign(ME,v); toast('Gespeichert'); render(); }catch(e){} finally{ b.disabled=false; }
}

/* ===== Render ===== */
const PAGES={dashboard,jobs:jobsPage,rechnungen,profil};
async function render(){
  const on=!!SESSION;
  document.querySelector('.layout').style.gridTemplateColumns = on ? '' : '1fr';
  $('side').style.display = on ? '' : 'none'; $('outBtn').style.display = on ? '' : 'none'; $('who').textContent = on ? (SESSION.email||'') : '';
  if(!on){ $('main').innerHTML=authView(); return; }
  if(!LOADED){
    $('main').innerHTML='<div class="empty">Lade dein Portal …</div>';
    try{ await loadAll(); }catch(e){ if(!SESSION) return; $('main').innerHTML=`<div class="card empty">Das Portal konnte nicht geladen werden: ${esc(e.message)}<br><br><button class="btn" onclick="LOADED=false;render()">Nochmal versuchen</button> <button class="btn" onclick="logout()">Abmelden</button></div>`; return; }
  }
  drawNav(); $('main').innerHTML=(PAGES[route()]||dashboard)();
}
window.addEventListener('hashchange',()=>{ render(); window.scrollTo(0,0); });
render();
</script>
</body>
