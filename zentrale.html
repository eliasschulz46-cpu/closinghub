<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Zentrale · ClosingHub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230E1A2B%22/%3E%3Ctext x=%2232%22 y=%2248%22 text-anchor=%22middle%22 font-family=%22Arial Black,Arial%22 font-weight=%22900%22 font-size=%2246%22 fill=%22%23ffffff%22%3EH%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  :root{--bg:#0A0A0B;--bg2:#111113;--card:#141416;--line:#232327;--fg:#F5F5F5;--muted:#8B8B93;--gold:#D4A843;--grad:linear-gradient(135deg,#F3D58A,#D4A843 50%,#A97C22);--ok:#5FBF7A;--warn:#E0A84A;--bad:#E06A6A}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5}
  a{color:inherit;text-decoration:none}
  button,input,select,textarea{font:inherit;color:inherit}
  .gold{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .muted{color:var(--muted)}
  .logo{display:inline-flex;align-items:baseline;white-space:nowrap;line-height:1;font-size:24px}
  .logo .l1{font-family:Parisienne,cursive;margin-right:.08em}
  .logo .l2{font-family:'Bebas Neue',sans-serif;font-size:1.12em;letter-spacing:.01em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

  .top{position:sticky;top:0;z-index:30;height:60px;display:flex;align-items:center;gap:16px;padding:0 20px;background:rgba(10,10,11,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .top .tag{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line);padding-left:14px}
  .top .sp{flex:1}
  .top .search{width:260px;max-width:30vw}
  .layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 60px)}
  .side{border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
  .side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500;transition:background .15s,color .15s}
  .side a:hover{background:var(--bg2);color:var(--fg)}
  .side a.on{background:#1a1710;color:var(--fg)}
  .side a.on svg{color:var(--gold)}
  .side .grp{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#5d5d64;margin:16px 12px 6px}
  .side .bdg{margin-left:auto;font-size:11px;background:var(--gold);color:#111;border-radius:99px;padding:0 7px;font-weight:700}
  .main{padding:26px 28px 60px;min-width:0}
  .h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:2px 0 20px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .between{justify-content:space-between}
  .grid{display:grid;gap:14px}
  .g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .card h3{font-size:14px;font-weight:600;margin-bottom:12px}
  .kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font-size:28px;font-weight:700;margin-top:4px;letter-spacing:-.02em} .kpi .s{font-size:12px;margin-top:2px;color:var(--muted)}
  .up{color:var(--ok)} .down{color:var(--bad)}
  .btn{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--bg2);transition:border-color .15s,transform .1s}
  .btn:hover{border-color:var(--gold)} .btn:active{transform:scale(.97)}
  .btn.gold-b{background:var(--grad);color:#111;border:0}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn.red:hover{border-color:var(--bad);color:var(--bad)}
  .in,select.in,textarea.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none}
  .in:focus{border-color:var(--gold)}
  label.f{display:grid;gap:5px;font-size:12px;color:var(--muted)}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
  td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#17171a}
  .tw{overflow-x:auto;padding:0}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
  .p-ok{color:var(--ok);border-color:#2c4a34} .p-warn{color:var(--warn);border-color:#4d3d22} .p-bad{color:var(--bad);border-color:#F3C9C4} .p-gold{color:var(--gold);border-color:#4a3c1c}
  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .tabs button{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 14px;cursor:pointer;color:var(--muted);font-weight:500}
  .tabs button.on{border-color:var(--gold);color:var(--fg);background:#1a1710}
  .bar{height:8px;border-radius:9px;background:#1f1f23;overflow:hidden} .bar i{display:block;height:100%;background:var(--grad);border-radius:9px}
  .item{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)} .item:first-child{border-top:0}
  .ico{width:36px;height:36px;border-radius:50%;border:1px solid #3a3222;display:grid;place-items:center;flex:none;color:var(--gold)}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .demo{font-size:12px;color:var(--warn);border:1px dashed #4d3d22;border-radius:10px;padding:8px 12px;margin-bottom:18px}
  .switch{position:relative;width:38px;height:22px;flex:none;cursor:pointer}
  .switch input{opacity:0;width:0;height:0}
  .switch span{position:absolute;inset:0;background:#2a2a2f;border-radius:99px;transition:.2s}
  .switch span:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .switch input:checked+span{background:var(--gold)} .switch input:checked+span:before{transform:translateX(16px)}
  .ticker{height:38px;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;background:var(--bg2);display:flex;align-items:center}
  .ticker .lab{position:relative;z-index:2;padding:0 12px;height:100%;display:flex;align-items:center;background:var(--bg2);color:var(--gold);font-weight:600;font-size:12px;border-right:1px solid var(--line)}
  .ticker .track{display:flex;gap:40px;white-space:nowrap;animation:run 30s linear infinite;padding-left:20px;font-size:13px}
  .ticker .track b{color:var(--gold);font-weight:600}
  @keyframes run{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .chat{display:flex;flex-direction:column;gap:10px;max-height:380px;overflow:auto;padding:4px}
  .msg{max-width:78%;padding:10px 14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
  .msg.me{align-self:flex-end;background:#1a1710;border-color:#3a3222}
  .msg small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
  .list-sel{cursor:pointer;padding:12px;border-radius:12px;border:1px solid transparent}
  .list-sel:hover{background:var(--bg2)} .list-sel.on{border-color:var(--gold);background:#1a1710}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
  .modal.open{display:flex}
  .modal .card{width:100%;max-width:560px;max-height:88vh;overflow:auto}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card);border:1px solid var(--gold);padding:10px 18px;border-radius:12px;transition:transform .3s;z-index:70}
  .toast.show{transform:translateX(-50%) translateY(0)}
  svg{flex:none}
  .chart text{fill:var(--muted);font-size:11px}
  .supg{grid-template-columns:320px 1fr}.dashg{grid-template-columns:1.6fr 1fr}
  @media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
  @media(max-width:820px){
    .layout{grid-template-columns:1fr}
    .side{position:sticky;top:60px;height:auto;display:flex;gap:4px;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line);background:var(--bg);z-index:20}
    .side .grp{display:none} .side a{white-space:nowrap;padding:8px 12px}
    .main{padding:18px 14px 50px} .g2,.g3,.supg,.dashg{grid-template-columns:1fr} .top .search,.top .tag{display:none}
  }
  @media(max-width:480px){.g4{grid-template-columns:1fr 1fr}.kpi .v{font-size:22px}}
  @media print{.top,.side,.no-print{display:none!important}}

  /* Logo-Animation: Linien von „closing“ leuchten nach und nach auf wie ein LED-Band (≈6 s) */
  .l1{position:relative;display:inline-block}
  .l1 .ink{display:inline-block;opacity:.38}
  .light .l1 .ink{opacity:1}
  .l1 .glow{position:absolute;left:0;top:0;pointer-events:none;color:#fff;
    text-shadow:0 0 1px #fff,0 0 2px rgba(255,255,255,.95),0 0 5px rgba(255,255,255,.6);
    clip-path:inset(-60% -25% -70% -15%)}
  .play .l1 .glow{animation:chGlow 6s linear .3s both}
  @keyframes chGlow{
    0%{clip-path:inset(-60% 100% -70% -15%)} 10%{clip-path:inset(-60% 97% -70% -15%)} 30%{clip-path:inset(-60% 72% -70% -15%)}
    50%{clip-path:inset(-60% 50% -70% -15%)} 70%{clip-path:inset(-60% 28% -70% -15%)} 88%{clip-path:inset(-60% 8% -70% -15%)}
    100%{clip-path:inset(-60% -25% -70% -15%)} }
  @keyframes chDot{
    0%{left:2%;top:18%;opacity:0;transform:translate(-50%,-50%) scale(.3)}
    5%{opacity:1;transform:translate(-50%,-50%) scale(1.25)} 10%{left:3%;top:22%;transform:translate(-50%,-50%) scale(1)}
    30%{left:28%;top:58%} 50%{left:50%;top:42%} 70%{left:72%;top:58%} 88%{left:92%;top:50%;opacity:1}
    100%{left:100%;top:50%;opacity:0;transform:translate(-50%,-50%) scale(.5)} }
  .light .l1 .glow{color:inherit;text-shadow:none}
  @media (prefers-reduced-motion:reduce){.play .l1 .glow{animation:none}}

  .lgi canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .lgi .lg-c{opacity:.38}
  .lgi .lg-lit{filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 3px rgba(255,255,255,.75))}
  .lgi .lg-head{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px #fff) drop-shadow(0 0 10px rgba(255,255,255,.75))}
  .lgi .lg-hub{opacity:.28}
  .lgi.hub-on .lg-hub{opacity:1;filter:brightness(1.3) saturate(1.25) drop-shadow(0 0 2px rgba(255,220,80,.95)) drop-shadow(0 0 7px rgba(255,205,50,.6)) drop-shadow(0 0 14px rgba(255,190,40,.3))}
  .light .lgi .lg-c{opacity:1;filter:brightness(.12)}
  .light .lgi canvas{display:none}
  .light .lgi .lg-hub{opacity:1!important;filter:none!important}
  details.rt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;background:var(--bg2)}
  details.rt summary{cursor:pointer;list-style:none;display:flex;align-items:center}
  details.rt summary::before{content:'▸';color:var(--gold);margin-right:10px;transition:transform .2s}
  details.rt[open] summary::before{transform:rotate(90deg)}

<style id="vertrag-theme">
  /* ClosingHub Vertragsdesign: Papier, Tinte, Abschluss-Grün */
  :root{--bg:#F2F4F1;--bg2:#F7F8F6;--card:#FFFFFF;--line:#E1E5DF;--fg:#0E1A2B;--muted:#5B6576;--gold:#087A4B;--grad:#087A4B;--ok:#087A4B;--warn:#A15C07;--bad:#B42318;
    --ink:#0E1A2B;--deal:#087A4B;--deal-press:#06603B;--deal-soft:#E3F1EA;--pen:#1F3FBF;--seal:#B8860B;--navy-line:#22324A;--navy-text:#C9D3E3}
  html,body{font-family:Archivo,system-ui,sans-serif;font-size:14.5px;-webkit-font-smoothing:antialiased}
  .gold{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--deal)}
  .logo{color:var(--ink)}
  .logo .l1{font-family:Parisienne,cursive}
  .logo .l2{font-family:"Bebas Neue",sans-serif;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--ink)}
  .top{background:rgba(255,255,255,.92);border-bottom:1px solid var(--line)}
  .top .tag{color:var(--muted);letter-spacing:.04em;text-transform:none;font-size:13px;font-weight:600}
  .side{background:var(--bg)}
  .side a{color:#3B4657;font-weight:600}
  .side a:hover{background:#E8ECE6;color:var(--ink)}
  .side a.on{background:var(--ink);color:#fff}
  .side a.on svg{color:#7FD1A8}
  .side .grp{color:#7A8494;letter-spacing:.04em;text-transform:none;font-size:12px;font-weight:700}
  .side .bdg{background:var(--deal);color:#fff}
  .side a.on .bdg{background:#fff;color:var(--ink)}
  .h1{font-weight:900;font-variation-settings:"wdth" 80;font-size:30px;letter-spacing:-.005em;line-height:1.05}
  .card{border-color:#E3E7E1;border-radius:12px;box-shadow:0 1px 2px rgba(14,26,43,.05),0 10px 26px -14px rgba(14,26,43,.16)}

async function auth(grant, body){
  const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=${grant}`, { method:'POST', headers:{ apikey:SB_KEY, 'Content-Type':'application/json' }, body:JSON.stringify(body) });
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description || j.msg || j.message || 'Login fehlgeschlagen');

}
async function refresh(){ if(!SESSION) throw new Error('nicht angemeldet'); await auth('refresh_token', { refresh_token:SESSION.refresh_token }); }

async function api(path, { method='GET', body, prefer } = {}, retry=true){
  if(SESSION && SESSION.expires_at - 60 < Date.now()/1000){ try{ await refresh(); }catch(e){ logout(); throw e; } }
  const headers = { apikey:SB_KEY, 'Content-Type':'application/json' };
  if(SESSION) headers.Authorization = 'Bearer ' + SESSION.access_token;
  if(prefer) headers.Prefer = prefer;
  const r = await fetch(`${SB_URL}/rest/v1/${path}`, { method, headers, body: body!==undefined ? JSON.stringify(body) : undefined });
  if(r.status===401 && retry && SESSION){ try{ await refresh(); return api(path, { method, body, prefer }, false); }catch(e){ logout(); throw e; } }
  if(!r.ok){ const j = await r.json().catch(()=>({})); throw new Error(j.message || ('Fehler ' + r.status)); }
  const t = await r.text(); return t ? JSON.parse(t) : null;
}

// Schnell-Vorschlag ohne KI (falls die KI-Funktion noch nicht eingerichtet ist)
function quickParse(t, j={}){
  t=t||''; const low=(t+' '+(j.rolle||'')).toLowerCase(), f={};
  f.rolle = j.rolle || (/closer/.test(low)&&/setter/.test(low) ? 'Closer & Setter' : /setter/.test(low) ? 'Setter' : 'Closer');
  f.modell = j.modell || (/remote|home.?office|online/.test(low) ? 'Remote' : /vor ort|außendienst|aussendienst/.test(low) ? 'Vor Ort' : null);
  const prov=t.match(/(\d{1,2}(?:[.,]\d)?\s?%[^.,;\n]{0,30})/); if(prov) f.provision=prov[1].trim();
  const eur=t.match(/(\d[\d.]*\s?(?:–|-|bis)?\s?\d*[\d.]*\s?(?:€|eur))(\s*(?:pro|je)\s+(?:termin|abschluss|deal|lead)[^.,;\n]{0,20})?/i);
  if(eur){ if(eur[2]){ if(!f.provision) f.provision=(eur[1]+eur[2]).trim(); } else f.ticket=eur[1].trim(); }
  const CONTACT=/\S+@\S+|\+?\d[\d\s\/-]{7,}\d|https?:\/\/\S+|www\.\S+/;
  const clean=t.replace(/\s+/g,' ').trim();
  let d=''; for(const s of (clean.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g)||[])){ if(CONTACT.test(s)) continue; if((d+s).length>320) break; d+=s; }
  f.beschreibung=(d||clean.replace(new RegExp(CONTACT.source,'g'),'').slice(0,300)).trim();
  const br=j.branche||j.produkt||'';
  f.titel=`${f.rolle}${br?' für '+br:''}${f.modell==='Remote'?' (Remote)':''}`.slice(0,70);
  return f;
}
const jobText = j => [j.rolle&&'Gesucht: '+j.rolle, j.branche&&'Branche: '+j.branche, j.produkt&&'Produkt: '+j.produkt, j.ticket&&'Preis des Produkts: '+j.ticket, j.provision&&'Provision: '+j.provision, j.fixum&&'Fixum: '+j.fixum, j.modell&&'Arbeitsmodell: '+j.modell, j.region&&'Region: '+j.region, j.umfang&&'Umfang: '+j.umfang, j.start_text&&'Start: '+j.start_text, j.auftragsdauer&&'Dauer: '+j.auftragsdauer, j.anforderungen&&'Anforderungen: '+j.anforderungen, j.anfrage_text&&'Beschreibung des Auftraggebers: '+j.anfrage_text].filter(Boolean).join('\n').slice(0,5800);
let KI_OFF=false;
async function summarize(j){
  let r=null, ki=false;
  if(!KI_OFF){
    try{
      const res=await fetch(`${SB_URL}/functions/v1/ki-job`,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SESSION.access_token,'Content-Type':'application/json'},body:JSON.stringify({text:jobText(j)})});
      const out=await res.json().catch(()=>({}));
      if(res.ok && out && !out.error){ r=out; ki=true; } else { if(res.status===404||res.status===401||res.status===403) KI_OFF=true; }
    }catch(e){ KI_OFF=true; }
  }
  if(!r) r=quickParse(j.anfrage_text, j);
  if(Array.isArray(r.anforderungen)) r.anforderungen=r.anforderungen.map(x=>'• '+String(x).replace(/^•\s*/,'')).join('\n');
  return {r,ki};
}
const SUM_KEYS=['titel','rolle','branche','produkt','ticket','provision','fixum','modell','region','umfang','start_text','auftragsdauer','anforderungen','beschreibung'];
let AUTO_BUSY=false;
/* Neue Anfragen automatisch in die Felder übernehmen (Angaben des Auftraggebers bleiben, nur Leeres wird ergänzt) */
async function autoPrep(){
  if(AUTO_BUSY||!SESSION) return; AUTO_BUSY=true; let done=0;
  try{
    for(const j of D.jobs.filter(x=>x.status==='anfrage' && !x.beschreibung && (x.anfrage_text||'').trim()).slice(0,8)){
      const {r}=await summarize(j); const patch={};
      SUM_KEYS.forEach(k=>{ if((j[k]===null||j[k]===undefined||j[k]==='') && r[k]) patch[k]=String(r[k]).slice(0,k==='beschreibung'||k==='anforderungen'?1500:160); });
      if(!patch.beschreibung){ const q2=quickParse(j.anfrage_text,j); patch.beschreibung=q2.beschreibung; if(!j.titel&&!patch.titel) patch.titel=q2.titel; }
      if((!j.fragen||!j.fragen.length) && Array.isArray(r.fragen) && r.fragen.length) patch.fragen=r.fragen.slice(0,3).map(x=>String(x).slice(0,160));
      if(!patch.beschreibung) continue;
      try{ await api(`jobs?id=eq.${j.id}`,{method:'PATCH',body:patch}); Object.assign(j,patch); done++; }catch(e){}
    }
  } finally { AUTO_BUSY=false; }
  if(done && !document.querySelector('.modal.open')){ drawNav(); $('main').innerHTML=(PAGES[route()]||dashboard)(); toast(done+(done===1?' Anfrage':' Anfragen')+' automatisch zusammengefasst'); }
}

async function saveJob(id,status,b){
  const v={};
  document.querySelectorAll('#mbox [data-j]').forEach(el=>{ const k=el.dataset.j; let x=el.value.trim();
    if(k==='top') x = x==='true'; else if(['anzeige_tage'].includes(k)) x=parseInt(x)||30; else if(k.startsWith('kosten_')) x = x===''?null:parseFloat(x); else if(x==='') x=null;
    v[k]=x; });
  v.fragen=[...document.querySelectorAll('#mbox [data-f]')].map(el=>el.value.trim()).filter(Boolean).slice(0,3);
  if(!v.titel) return toast('Bitte einen Titel eingeben');
  const pub = status==='live' || status==='freigabe';
  if(pub && !v.provision) return toast('Bitte die Provision angeben');
  if(pub && !v.beschreibung) return toast('Bitte eine Beschreibung eintragen');
  if(pub && /\S+@\S+|\+?\d[\d\s\/-]{8,}\d|https?:\/\//.test((v.beschreibung||'')+(v.anforderungen||''))) return toast('Bitte keine Kontaktdaten oder Links in Beschreibung/Anforderungen');
  v.status=status; if(status==='freigabe') v.client_note=null;
  const old=D.jobs.find(x=>x.id===id);
  if(status==='live' && (!old || old.status!=='live')){ v.published_at=new Date().toISOString(); v.expires_at=new Date(Date.now()+v.anzeige_tage*864e5).toISOString(); }
  b.disabled=true;
  try{
    if(id){ await q(`jobs?id=eq.${id}`,{method:'PATCH',body:v}); Object.assign(old,v); }
    else { const [r]=await q('jobs',{method:'POST',prefer:'return=representation',body:v}); D.jobs.unshift(r); }
    const wasLive = !!(v.published_at);
    closeModal(); jobTab=status; render(); toast(status==='live'?'Veröffentlicht – ist jetzt in der App':status==='freigabe'?'Liegt jetzt beim Auftraggeber zur Freigabe':'Entwurf gespeichert');
    if(status==='live' && wasLive && id && old && old.client_id){ await offerJobInvoice(old); render(); }
  }catch(e){ b.disabled=false; }
}

async function clSaveFees(id,b){
  const v={}; ['fee_job','fee_top','fee_unlock'].forEach(k=>{ const x=$('cf-'+k).value.trim(); v[k]= x==='' ? null : Math.max(0,parseFloat(x)||0); });
  b.disabled=true; try{ await q(`clients?id=eq.${id}`,{method:'PATCH',body:v}); Object.assign(clById(id),v); render(); toast('Gebühren gespeichert'); }catch(e){ b.disabled=false; }
}
async function clCancel(id){
  const c=clById(id), live=clJobs(id).filter(j=>j.status==='live');
  if(!confirm(`${c.firma} wirklich kündigen?\n\n• Der Auftraggeber kann keine Jobs mehr einreichen.\n• ${live.length} laufende Jobs werden beendet.\n• Rechnungen und Daten bleiben erhalten.`)) return;
  const patch={status:'gekuendigt',gekuendigt_am:new Date().toISOString()};
  await q(`clients?id=eq.${id}`,{method:'PATCH',body:patch}); Object.assign(c,patch);
  if(live.length){ await q(`jobs?client_id=eq.${id}&status=eq.live`,{method:'PATCH',body:{status:'beendet'}}); live.forEach(j=>j.status='beendet'); }
  render(); toast('Auftraggeber gekündigt');
}
async function clDelete(id){
  const c=clById(id); if(!c) return;
  if(c.status==='aktiv') return toast('Nur ehemalige Auftraggeber können gelöscht werden. Erst kündigen.');
  const jobs=clJobs(id), inv=clInv(id);
  if(jobs.some(j=>j.status==='live')) return toast('Es laufen noch Jobs. Erst beenden.');
  if(!confirm(`${c.firma} endgültig löschen?\n\n• Profil und Stammdaten werden gelöscht.\n• ${jobs.length} Job(s) werden gelöscht.\n• ${inv.length} Rechnung(en) bleiben für die Buchhaltung erhalten.\n\nDas kann nicht rückgängig gemacht werden.`)) return;
  const t=prompt('Zweite Bestätigung: Tippe LÖSCHEN, um '+c.firma+' endgültig zu entfernen.');
  if((t||'').trim().toUpperCase()!=='LÖSCHEN') return toast('Abgebrochen, nichts gelöscht');
  try{
    if(jobs.length) await q(`jobs?client_id=eq.${id}`,{method:'DELETE'});
    const del=await q(`clients?id=eq.${id}`,{method:'DELETE',prefer:'return=representation'});
    if(Array.isArray(del)&&!del.length) return toast('⚠️ Löschen wurde von der Datenbank nicht ausgeführt');
    D.jobs=D.jobs.filter(j=>j.client_id!==id); D.invoices.forEach(i=>{ if(i.client_id===id) i.client_id=null; });
    D.clients=D.clients.filter(x=>x.id!==id); clSel=null; render(); toast('Auftraggeber gelöscht');
  }catch(e){}
}
async function clReactivate(id){
  const patch={status:'aktiv',gekuendigt_am:null}; await q(`clients?id=eq.${id}`,{method:'PATCH',body:patch}); Object.assign(clById(id),patch); render(); toast('Wieder aktiv');
}

async function jobInvoice(id){ const j=D.jobs.find(x=>x.id===id); if(!j) return toast('Job nicht gefunden – bitte Seite neu laden'); const n=D.invoices.length;

function jobInvoiceManual(job,c){
  newInvoice(c?c.id:null);

async function jobAend(id,ok,b){ b.disabled=true;
  try{ const r=await q('rpc/job_aenderung_entscheiden',{method:'POST',body:{p_id:id,p_ok:ok}}); const j=D.jobs.find(x=>x.id===id); if(j&&r) Object.assign(j,r); render(); toast(ok?'Übernommen – ist jetzt online':'Abgelehnt – der alte Text bleibt'); }
  catch(e){ b.disabled=false; } }
async function offerJobInvoice(job){
  const c=clById(job.client_id);
  const fee=c ? feeOf(c,'fee_job') + (job.top ? feeOf(c,'fee_top') : 0) : 0;
  if(!c || !(fee>0)){ jobInvoiceManual(job,c); return; }
  if(!confirm(`Rechnung über ${eur(fee)} netto an ${c.firma} für diesen Job erstellen?`)) return;
  const [r]=await q('invoices',{method:'POST',prefer:'return=representation',body:{no:nextNo(),customer:c.firma,email:c.email||null,item:`Stellenanzeige „${job.titel}“${job.top?' (Top-Job)':''}`,net:fee,vat:D.settings.vat,status:'offen',client_id:c.id}});
  D.invoices.unshift({id:r.id,no:r.no,date:r.created_at.slice(0,10),cust:r.customer,email:r.email||'',item:r.item,net:+r.net,vat:+r.vat,st:r.status,client_id:r.client_id});
  toast('Rechnung '+r.no+' erstellt');
}

function chart(vals, labels){
  const w=640,h=200,p=28, max=Math.max(...vals,1)*1.15, stepX=(w-p*2)/(vals.length-1);
  const pts=vals.map((v,i)=>[p+i*stepX, h-p-(v/max)*(h-p*2)]);
  const line=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="none" style="height:200px">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#087A4B" stop-opacity=".35"/><stop offset="1" stop-color="#087A4B" stop-opacity="0"/></linearGradient></defs>
    ${[0,.5,1].map(k=>`<line x1="${p}" x2="${w-p}" y1="${p+k*(h-p*2)}" y2="${p+k*(h-p*2)}" stroke="#E1E5DF"/>`).join('')}
    <path d="${line} L${pts.at(-1)[0]},${h-p} L${p},${h-p}Z" fill="url(#ga)"/>
    <path d="${line}" fill="none" stroke="#087A4B" stroke-width="2.2"/>
    ${pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="3" fill="#FFFFFF" stroke="#087A4B" stroke-width="1.6"><title>${labels[i]}: ${vals[i]}</title></circle>`).join('')}
    ${labels.map((l,i)=> i%2===0?`<text x="${p+i*stepX}" y="${h-6}" text-anchor="middle">${l}</text>`:'').join('')}
  </svg>`;
}

async function aiSet(id,st){ await q(`ai_suggestions?id=eq.${id}`,{method:'PATCH',body:{status:st}}); D.ai.find(a=>a.id===id).st=st; render(); toast(st==='übernommen'?'Übernommen':'Gespeichert'); }

  if(location.hash.includes('?neu')) setTimeout(newInvoice,0);

  ${list.map(i=>`<tr><td style="white-space:nowrap"><b>${esc(i.no)}</b></td><td class="muted">${new Date(i.date).toLocaleDateString('de-DE')}</td><td>${esc(i.cust)}</td><td class="muted">${esc(i.item)}</td><td><b>${eur(gross(i))}</b></td><td>${pill(i.st)}</td>
    <td style="text-align:right;white-space:nowrap"><button class="btn sm" onclick="showInvoice(${i.id})">Ansehen</button> ${i.st==='offen'||i.st==='überfällig'?`<button class="btn sm" onclick="invSet(${i.id},'bezahlt')">${ic('check',13)} Bezahlt</button> ${i.st==='offen'?`<button class="btn sm" onclick="invSet(${i.id},'überfällig')">Überfällig</button>`:''} <a class="btn sm" href="mailto:${esc(i.email)}?subject=${encodeURIComponent('Zahlungserinnerung '+i.no)}">Erinnern</a>`:''} <button class="btn sm red" title="Rechnung löschen" onclick="invDel(${i.id})">${ic('trash',13)}</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty">${D.invoices.length?'Keine Rechnungen gefunden.':'Noch keine Rechnungen. Leg oben rechts die erste an.'}</td></tr>`}
  </tbody></table></div>`;
}
async function invDel(id){ const i=D.invoices.find(x=>x.id===id); if(!i) return; if(!confirm(`Rechnung ${i.no} (${i.cust}, ${eur(gross(i))}) endgültig löschen?\n\nDas kann nicht rückgängig gemacht werden.`)) return; await q(`invoices?id=eq.${id}`,{method:'DELETE'}); D.invoices=D.invoices.filter(x=>x.id!==id); render(); toast('Rechnung gelöscht'); }
async function invSet(id,st){ await q(`invoices?id=eq.${id}`,{method:'PATCH',body:{status:st}}); D.invoices.find(i=>i.id===id).st=st; render(); toast('Gespeichert'); }
function nextNo(){ const y=new Date().getFullYear(); const n=Math.max(0,...D.invoices.filter(i=>i.no.startsWith('CH-'+y)).map(i=>+i.no.split('-')[2]||0))+1; return `CH-${y}-${String(n).padStart(4,'0')}`; }
function newInvoice(cid){
  D._invJob=null;

  </div>`);
}
async function saveInvoice(b){
  const c=$('iCust').value.trim(), n=parseFloat($('iNet').value);
  if(!c||!(n>0)) return toast('Bitte Kunde und Betrag ausfüllen');
  b.disabled=true;
  try{
    const [r]=await q('invoices',{method:'POST',prefer:'return=representation',body:{no:nextNo(),customer:c,email:$('iMail').value.trim()||null,item:$('iItem').value,net:n,vat:D.settings.vat,status:'offen',...( $('iClient').value ? {client_id:+$('iClient').value} : {} )}});
    D.invoices.unshift({id:r.id,no:r.no,date:r.created_at.slice(0,10),cust:r.customer,email:r.email||'',item:r.item,net:+r.net,vat:+r.vat,st:r.status,client_id:r.client_id??null});
    closeModal(); if(D._invJob){ const jid=D._invJob; D._invJob=null; try{ await setJob(jid,{rechnung_offen:false}); }catch(x){} } render(); toast('Rechnung erstellt');
  }catch(e){ b.disabled=false; }
}

function laufband(){
  const on=D.ticker.filter(t=>t.on), items=on.map(t=>`<span>${esc(t.title)} · <b>${esc(t.offer)}</b></span>`).join('');
  return `<div class="row between"><div><h1 class="h1">Laufband & Angebote</h1><p class="sub">Was oben in der App durchläuft. Änderungen sind sofort live.</p></div><button class="btn gold-b" onclick="editTick()">+ Angebot</button></div>
  <div class="card" style="margin-bottom:16px"><h3>Live-Vorschau</h3>
    <div class="ticker"><span class="lab">🎁 Member-Vorteile</span><div style="overflow:hidden;flex:1"><div class="track">${items}${items}</div></div></div>
    <p class="muted" style="font-size:12px;margin-top:8px">${on.length} aktiv · Umsatz Laufband: <b class="gold">${eur(on.reduce((a,t)=>a+(+t.price||0),0))} / Monat</b></p></div>
  <div class="card tw"><table><thead><tr><th></th><th>Angebot</th><th>Partner</th><th>Preis/Monat</th><th>Läuft bis</th><th>Aktiv</th><th></th></tr></thead><tbody>
  ${D.ticker.map((t,i)=>`<tr><td style="white-space:nowrap"><button class="btn sm" ${i?'':'disabled'} onclick="moveTick(${i},-1)">${ic('up',13)}</button> <button class="btn sm" ${i<D.ticker.length-1?'':'disabled'} onclick="moveTick(${i},1)">${ic('down',13)}</button></td>
    <td><b>${esc(t.title)}</b><div class="gold" style="font-size:12px">${esc(t.offer)}</div>${t.link?`<a class="muted" style="font-size:12px" href="${esc(t.link)}" target="_blank" rel="noopener">↗ ${esc(t.link.replace(/^https?:\/\//,'').slice(0,40))}</a>`:'<span class="muted" style="font-size:12px">kein Link</span>'}</td><td class="muted">${esc(t.partner)||'–'}</td><td>${eur(t.price||0)}</td>
    <td class="${t.until&&new Date(t.until)<new Date(Date.now()+864e6)?'down':'muted'}">${t.until?new Date(t.until).toLocaleDateString('de-DE'):'unbegrenzt'}</td>
    <td><label class="switch"><input type="checkbox" ${t.on?'checked':''} onchange="tickActive(${t.id},this.checked)"><span></span></label></td>
    <td style="text-align:right;white-space:nowrap"><button class="btn sm" onclick="editTick(${t.id})">${ic('pen',13)}</button> <button class="btn sm red" onclick="delTick(${t.id})">${ic('trash',13)}</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Noch keine Angebote.</td></tr>'}
  </tbody></table></div>`;
}
async function tickActive(id,on){ await q(`ticker?id=eq.${id}`,{method:'PATCH',body:{active:on}}); D.ticker.find(t=>t.id===id).on=on; render(); toast(on?'Läuft jetzt':'Pausiert'); }
async function moveTick(i,d){
  const a=D.ticker; [a[i],a[i+d]]=[a[i+d],a[i]];
  await Promise.all(a.map((t,k)=>t.sort!==k+1 ? (t.sort=k+1, q(`ticker?id=eq.${t.id}`,{method:'PATCH',body:{sort:k+1}})) : null));
  render();
}
async function delTick(id){ const t=D.ticker.find(x=>x.id===id); if(!confirm(`„${t.title}“ wirklich löschen?`)) return; await q(`ticker?id=eq.${id}`,{method:'DELETE'}); D.ticker=D.ticker.filter(x=>x.id!==id); render(); toast('Gelöscht'); }
function editTick(id){
  const t=D.ticker.find(x=>x.id===id)||{title:'',offer:'',partner:'',price:149,until:'',on:true,link:''};
  openModal(`<h3 style="font-size:18px">${id?'Angebot bearbeiten':'Neues Angebot'}</h3>
  <div class="grid" style="gap:12px;margin-top:12px">
    <label class="f">Titel<input class="in" id="tT" value="${esc(t.title)}" placeholder="z. B. Profi-Headset"></label>
    <label class="f">Angebot (gold)<input class="in" id="tO" value="${esc(t.offer)}" placeholder="z. B. −25 % für Member"></label>
    <label class="f">Link zum Produkt (wird in der App beim Antippen geöffnet)<input class="in" id="tL" type="url" value="${esc(t.link||'')}" placeholder="https://…"></label>
    <label class="f">Partner (nur für dich sichtbar)<input class="in" id="tP" value="${esc(t.partner)}"></label>
    <div class="grid g2" style="gap:12px"><label class="f">Preis / Monat (€)<input class="in" id="tPr" type="number" value="${t.price}"></label><label class="f">Läuft bis (leer = unbegrenzt)<input class="in" id="tU" type="date" value="${t.until}"></label></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Abbrechen</button><button class="btn gold-b" onclick="saveTick(${id||0},this)">Speichern</button></div></div>`);
}
async function saveTick(id,b){
  const v={title:$('tT').value.trim(),offer:$('tO').value.trim(),partner:$('tP').value.trim(),price:+$('tPr').value||0,until:$('tU').value||null};
  let L=$('tL').value.trim(); if(L && !/^https?:\/\//i.test(L)) L='https://'+L;
  if(L && !/^https?:\/\/[^\s"<>]+\.[^\s"<>]+$/i.test(L)) return toast('Der Link sieht nicht richtig aus');
  v.link = L||null;
  if(!v.title||!v.offer) return toast('Titel und Angebot ausfüllen');
  b.disabled=true;
  try{
    if(id){ await q(`ticker?id=eq.${id}`,{method:'PATCH',body:v}); Object.assign(D.ticker.find(x=>x.id===id),{...v,until:v.until||'',link:v.link||''}); }
    else { const [r]=await q('ticker',{method:'POST',prefer:'return=representation',body:{...v,active:true,sort:D.ticker.length+1}}); D.ticker.push({id:r.id,title:r.title,offer:r.offer,partner:r.partner||'',price:+r.price,until:r.until||'',on:r.active,sort:r.sort,link:r.link||''}); }
    closeModal(); render(); toast('Gespeichert – ist live');
  }catch(e){ b.disabled=false; }
}

/* ===== Member: Rang nach Erfahrung, Nachweise ===== */
const RANG=['','Starter','Rising','Performer','Dealmaker','Rainmaker'];
const PROOF_ART={ausbildung:'Ausbildungszertifikat (nur vom Ausbilder-Partner)',abrechnung:'Abrechnung / Provision',high_ticket:'High-Ticket-Abschluss (ab 5.000 €)',dauer:'Nachweis über die Dauer im Vertrieb',ausweis:'Ausweis',sonstiges:'Sonstiges'};
let mbSel=null, mbQ='';
const mbProofs = id => (D.proofs||[]).filter(p=>p.member_id===id);
const mbMonths = m => { if(!m.im_vertrieb_seit) return 0; const a=new Date(m.im_vertrieb_seit), b=new Date(); return Math.max(0,(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth()-(b.getDate()<a.getDate()?1:0)); };
const mbDauer = m => { const n=mbMonths(m); if(!m.im_vertrieb_seit) return 'nicht eingetragen'; return n>=12?`${Math.floor(n/12)} J. ${n%12} M.`:`${n} Monate`; };
// Was die Nachweise hergeben: Grundlage für den Rang
function mbFacts(m){
  const ok=mbProofs(m.id).filter(p=>p.status==='bestaetigt');
  return { mon:mbMonths(m), ausb:ok.some(p=>p.art==='ausbildung'), abr:ok.filter(p=>p.art==='abrechnung').reduce((a,p)=>a+(+p.monate||0),0), ht:ok.some(p=>p.art==='high_ticket'), gegen:ok.some(p=>p.gegengeprueft) };
}
function rankAuto(m){
  const f=mbFacts(m); let r=1;
  if(f.mon>=6||f.ausb) r=2;
  if(f.mon>=12&&f.abr>=3) r=3;
  if(f.mon>=36&&f.abr>=12&&f.ht) r=4;
  if(f.mon>=60&&f.abr>=12&&f.ht&&f.gegen) r=5;
  return r;
}
// Was für den nächsten Rang noch fehlt
function rankMissing(m){
  const f=mbFacts(m), r=Math.max(m.rang,rankAuto(m)); if(r>=5) return [];
  const need={2:[[f.mon>=6||f.ausb,'6 Monate im Vertrieb oder ein bestätigtes Ausbildungszertifikat']],
    3:[[f.mon>=12,'1 Jahr im Vertrieb'],[f.abr>=3,'bestätigte Abrechnungen über mindestens 3 Monate']],
    4:[[f.mon>=36,'3 Jahre im Vertrieb'],[f.abr>=12,'bestätigte Abrechnungen über mindestens 12 Monate'],[f.ht,'ein bestätigter High-Ticket-Abschluss ab 5.000 €']],
    5:[[f.mon>=60,'5 Jahre im Vertrieb'],[f.abr>=12,'bestätigte Abrechnungen über mindestens 12 Monate'],[f.ht,'ein bestätigter High-Ticket-Abschluss ab 5.000 €'],[f.gegen,'mindestens ein Nachweis von dir per Anruf gegengeprüft']]}[r+1];
  return need.filter(x=>!x[0]).map(x=>x[1]);
}
// Automatischer Aufstieg: Rang steigt nur, nie automatisch nach unten. Fest eingestellte Ränge bleiben.
async function mbAutoRise(){
  if(!D.members) return; const up=[];
  for(const m of D.members){ if(m.rang_fest) continue; const r=rankAuto(m); if(r>m.rang){ try{ await api(`members?id=eq.${m.id}`,{method:'PATCH',body:{rang:r}}); up.push(`${m.name}: ${RANG[m.rang]} → ${RANG[r]}`); m.rang=r; }catch(e){} } }
  if(up.length){ D.mbRise=(D.mbRise||[]).concat(up.map(t=>({t,at:new Date().toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'})}))).slice(-20); }
}

/* Paket + Test-Zustände (Basic, Premium-Test, Tag 15) – Tag 15 nutzt die echte Umstellung beim nächsten App-Öffnen */
function mbAboPatch(v){ const t=d=>new Date(Date.now()+d*864e5).toISOString();
  if(v==='basic') return {abo:'basic',abo_test:false,test_bis:t(-2),angebot_bis:t(-1),eingefroren:true};
  if(v==='test1') return {abo:'premium',abo_test:true,test_bis:t(14),angebot_bis:null,eingefroren:false};
  if(v==='test14') return {abo:'premium',abo_test:true,test_bis:t(1),angebot_bis:null,eingefroren:false};
  if(v==='tag15') return {abo:'premium',abo_test:true,test_bis:t(-1/1440),angebot_bis:null,eingefroren:false};
  return {abo:v,abo_test:false,test_bis:null,angebot_bis:null,eingefroren:false}; }

function ptPhoto(inp,i){

  const img=new Image(), url=URL.createObjectURL(f);
  img.onload=()=>{ const S=320, c=document.createElement('canvas'); c.width=c.height=S; const m=Math.min(img.width,img.height);
    c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S); URL.revokeObjectURL(url);
    const d=c.toDataURL('image/jpeg',.82);
    document.querySelector(`[data-pt="${i}"][data-f="img"]`).value=d; const pv=$('pt-img-'+i); pv.src=d; pv.style.visibility='';
    toast('Foto übernommen – mit „Profil speichern“ sichern'); };

/* ===== Nachweise: Original öffnen (privat) und beim Bestätigen automatisch geschwärzte Vorschau erzeugen ===== */
const zUid = () => { try{ const p=SESSION.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'); return JSON.parse(atob(p)).sub; }catch(e){ return null; } };
async function zToken(){ if(SESSION && SESSION.expires_at - 60 < Date.now()/1000) await refresh(); return SESSION.access_token; }
async function zProofBlob(p){
  if(!p.datei_url) return null;
  if(!/^nachweise\//.test(p.datei_url)){ const r=await fetch(p.datei_url); return r.ok?await r.blob():null; }
  const r=await fetch(`${SB_URL}/storage/v1/object/authenticated/${p.datei_url}`,{headers:{apikey:SB_KEY,Authorization:'Bearer '+await zToken()}});
  if(!r.ok) throw new Error('Dokument nicht gefunden ('+r.status+')'); return await r.blob();
}
async function zProofOpen(pid){
  const p=(D.proofs||[]).find(x=>x.id===pid); if(!p) return; const w=window.open('','_blank');
  try{ const b=await zProofBlob(p); if(!b) throw new Error('Kein Dokument'); w.location=URL.createObjectURL(b); }catch(e){ if(w) w.close(); toast('⚠️ '+e.message); }
}
async function zSchwaerzen(blob){
  const bmp=await createImageBitmap(blob), W=560, H=Math.round(W*bmp.height/bmp.width);
  const s=document.createElement('canvas'); s.width=26; s.height=Math.max(8,Math.round(26*bmp.height/bmp.width)); s.getContext('2d').drawImage(bmp,0,0,s.width,s.height);
  const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d'); x.imageSmoothingEnabled=false; x.drawImage(s,0,0,W,H);
  x.fillStyle='rgba(14,26,43,.45)'; x.fillRect(0,0,W,H);
  x.save(); x.translate(W/2,H/2); x.rotate(-0.35); x.fillStyle='rgba(255,255,255,.9)'; x.font='800 30px Archivo,system-ui,sans-serif'; x.textAlign='center'; x.fillText('GEPRÜFT · ClosingHub',0,10); x.restore();
  return await new Promise(ok=>c.toBlob(ok,'image/jpeg',.8));
}
async function zProofApprove(pid,btn){
  const p=(D.proofs||[]).find(x=>x.id===pid); if(!p) return; btn.disabled=true; btn.textContent='Schwärzt …';
  let vorschau=null;
  try{
    const b=await zProofBlob(p);
    if(b && /^image\//.test(b.type)){
      const g=await zSchwaerzen(b), path=`${zUid()}/geschwaerzt/${pid}-${Date.now()}.jpg`;
      const r=await fetch(`${SB_URL}/storage/v1/object/medien/${path}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+await zToken(),'Content-Type':'image/jpeg'},body:g});
      if(!r.ok) throw new Error('Vorschau hochladen fehlgeschlagen ('+r.status+')');
      vorschau=`${SB_URL}/storage/v1/object/public/medien/${path}`;
    }
  }catch(e){ toast('⚠️ '+e.message+' – Nachweis wird ohne Vorschau bestätigt'); }
  await mbProofSet(pid,{status:'bestaetigt',geprueft_at:new Date().toISOString(),vorschau_url:vorschau},vorschau?'Bestätigt – geschwärzte Vorschau ist beim Auftraggeber sichtbar':'Bestätigt');
}

      if(Math.abs(c2-a)>6&&Math.abs(d-b2)>6){ RD.hist.push(RD.boxes.slice()); RD.boxes.push([Math.min(a,c2),Math.min(b2,d),Math.abs(c2-a),Math.abs(d-b2)]); }

async function rdAuto(mem){

  }catch(e){ rdStatus('⚠️ Automatisches Schwärzen fehlgeschlagen ('+esc(e.message||'Fehler')+'). Bitte selbst schwärzen.'); }
  ok.disabled=false;
}
function rdRules(words,lines,name){ const out=[], add=w=>w&&out.push(w.i), nm=String(name).toLowerCase().split(/\s+/).filter(x=>x.length>=3);

    if(/^[A-Z]{2}\d{2}[A-Z0-9]*$/.test(t)||/^\+\d/.test(t)){ add(w); for(let j=k+1;j<Math.min(li.length,k+9)&&/\d/.test(li[j].t)&&!/[€%]/.test(li[j].t);j++) add(li[j]); }
    if(/^(tel|telefon|fon|fax|mobil|handy|iban|bic|konto|kontonr|kto|blz|kundennr|kunden-nr|kundennummer|vertragsnr|vertragsnummer|rechnungsnr|steuernr|steuer-nr|ust-id|ust-idnr|personalnr|mitgliedsnr|ausweisnr|geb|geboren)[.:]*$/i.test(t)){ for(let j=k+1;j<Math.min(li.length,k+9)&&/\d|^[A-Z]{2}\d/.test(li[j].t)&&!/[€%]/.test(li[j].t);j++) add(li[j]); }

  }));

D.mkKey=undefined;
const _gwzLoad12=gwzLoad;
gwzLoad=async function(){ try{ const k=await api('settings?select=value&key=eq.make_key'); D.mkKey=(k&&k[0]&&k[0].value)||''; }catch(e){ D.mkKey=''; } return _gwzLoad12(); };
gwzLaunch=async function(b){ const v={...(D.launch||{}),start:$('ln-start').value,gruender_tage:+$('ln-tage').value||7,gewinnspiel_ende:$('ln-ende').value,video:$('ln-video').value.trim(),insta:$('ln-insta').value.trim().replace(/^@/,'')}; if(!v.start) return toast('⚠️ Startdatum fehlt'); b.disabled=true; try{ await setKey('launch',v); D.launch=v; toast('Gespeichert – gilt sofort in der App'); }finally{ b.disabled=false; } };
function gwzCopy(t){ navigator.clipboard.writeText(t).then(()=>toast('Kopiert')); }
const gwzIg=u=>u?`<a href="https://instagram.com/${encodeURIComponent(u)}" target="_blank" rel="noopener">@${esc(u)}</a>`:'<span class="muted">fehlt</span>';
const gwzMk=a=>(a&&a.length)?a.map(gwzIg).join(', '):'<span class="muted">–</span>';
const gwzOk=v=>v?'<span style="color:#087A4B;font-weight:700">✓</span>':'<span style="color:#c0392b">✗</span>';
const gwzShot=u=>u?`<a href="${esc(u)}" target="_blank" rel="noopener" class="gold">Screenshot ↗</a>`:'<span style="color:#c0392b">✗</span>';
gewinnspiel=function(){ if(D.gwT===undefined){ D.gwT=null; gwzLoad(); }
  const L=D.launch||{}, A=D.gwT||[], T=A.filter(t=>t.voll), W=D.gwW||[], byId=Object.fromEntries(A.map(t=>[t.id,t])), lose=T.reduce((a,t)=>a+(+t.lose||0),0), ok=W.filter(w=>w.status!=='ungueltig').length;
  const stc={gezogen:['Prüfen','#B8892E'],bestaetigt:['Bestätigt','#087A4B'],ungueltig:['Ungültig','#c0392b']};
  const ep=`${SB_URL}/rest/v1/rpc/gewinnspiel_kommentare`;
  return `<div><h1 class="h1">Start & Gewinnspiel</h1><p class="sub">Launch-Datum, Gründungsmitglieder, Feed-Video und die Auslosung des Start-Gewinnspiels.</p>
  <div class="card"><h3 style="margin:0 0 6px">Launch</h3><p class="muted" style="font-size:12.5px;margin:0 0 12px">Ab dem Startdatum läuft die 14-Tage-Challenge für alle. Wer in den ersten Tagen Plus oder Premium nimmt, wird automatisch Gründungsmitglied.</p>
    <div class="row" style="gap:12px;flex-wrap:wrap;align-items:flex-end">
      <label style="font-size:12px">Start (Livestream)<br><input type="date" class="in" id="ln-start" value="${esc(L.start||'2026-12-13')}"></label>
      <label style="font-size:12px">Gründer-Zeitraum (Tage)<br><input type="number" class="in" id="ln-tage" min="1" max="30" style="width:90px" value="${+L.gruender_tage||7}"></label>
      <label style="font-size:12px">Gewinnspiel-Ende<br><input type="date" class="in" id="ln-ende" value="${esc(L.gewinnspiel_ende||'')}"></label>
      <label style="font-size:12px">Euer Instagram-Account<br><input class="in" id="ln-insta" placeholder="closinghub" style="width:160px" value="${esc(L.insta||'')}"></label>
      <label style="font-size:12px;flex:1;min-width:240px">Video oben im Feed während des Gewinnspiels (YouTube- oder Video-Link)<br><input class="in" id="ln-video" placeholder="https://youtube.com/shorts/…" value="${esc(L.video||'')}"></label>
      <button class="btn gold" onclick="gwzLaunch(this)">Speichern</button></div></div>
  <div class="card" style="margin-top:16px"><h3 style="margin:0 0 6px">Kommentar-Prüfung über Make</h3>
    <p class="muted" style="font-size:12.5px;margin:0 0 10px">Make liest alle 15 Minuten die Kommentare unter dem Gewinnspiel-Beitrag und schickt sie hierher. Wer mit seinem Instagram-Namen kommentiert und 2 Personen markiert, bekommt den Haken automatisch. Diese beiden Werte trägst du einmal im HTTP-Modul in Make ein.</p>
    ${D.mkKey===undefined?'<p class="muted">Lädt …</p>':!D.mkKey?'<p class="muted">Fehlt noch: closinghub-runde16.sql in Supabase ausführen.</p>':`
    <div style="font-size:12.5px;display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center">
      <b>URL</b><code style="word-break:break-all">${esc(ep)}</code><button class="btn sm" onclick="gwzCopy('${esc(ep)}')">Kopieren</button>
      <b>Schlüssel</b><code style="word-break:break-all">${esc(String(D.mkKey).slice(0,6))}… (geheim)</code><button class="btn sm" onclick="gwzCopy('${esc(String(D.mkKey))}')">Kopieren</button></div>`}</div>
  <div class="card" style="margin-top:16px"><div class="row between"><h3 style="margin:0">Teilnehmer</h3><button class="btn sm" onclick="gwzLoad()">Aktualisieren</button></div>
    <p class="muted" style="font-size:12.5px;margin:6px 0 12px">Im Lostopf ist jedes Plus/Premium-Mitglied mit einem Beitrag in der App (Pflicht). Jeder der 6 Punkte (Instagram-Name, Folgen, Like, Kommentar mit 2 Markierten, Story-Screenshot, Beitrag) bringt 1 Los, jeder Challenge-Tag bis zum Gewinnspiel-Ende 1 Extra-Los (max. 13). Folgen und Like sind Selbstauskunft – die prüfst du beim Gewinner.</p>
    ${D.gwT===null?'<p class="muted">Lädt …</p>':D.gwErr&&!A.length?`<p class="muted">Fehlt noch: closinghub-runde16.sql in Supabase ausführen.</p>`:`<div class="row" style="gap:28px;margin-bottom:12px"><div><b style="font-size:26px">${T.length}</b><div class="muted" style="font-size:12px">im Lostopf</div></div><div><b style="font-size:26px">${A.length-T.length}</b><div class="muted" style="font-size:12px">noch unvollständig</div></div><div><b style="font-size:26px">${lose}</b><div class="muted" style="font-size:12px">Lose gesamt</div></div><div><b style="font-size:26px">${ok}</b><div class="muted" style="font-size:12px">Gewinner gezogen</div></div></div>
    ${A.length?`<div style="max-height:380px;overflow:auto"><table class="tbl" style="width:100%;font-size:12.5px"><thead><tr><th style="text-align:left">Name</th><th style="text-align:left">Instagram</th><th>Folgen/Like</th><th style="text-align:left">Kommentar (markiert)</th><th>Story</th><th>Beitrag</th><th>Lose</th><th>Lostopf</th></tr></thead><tbody>${A.map(t=>`<tr style="${t.voll?'':'opacity:.65'}"><td>${esc(t.name)}<div class="muted" style="font-size:11px">${esc(t.abo)}</div></td><td>${gwzIg(t.insta)}</td><td style="text-align:center">${gwzOk(t.folgen)} ${gwzOk(t.liken)}</td><td>${t.kommentar_ok?gwzOk(1)+' ':''}${gwzMk(t.markiert)}</td><td style="text-align:center">${gwzShot(t.story_beweis)}</td><td style="text-align:center">${gwzOk(t.beitrag)}</td><td style="text-align:center">${t.lose}</td><td style="text-align:center">${t.voll?(t.gewinner?`<span style="color:${(stc[t.gewinner]||[])[1]}">${(stc[t.gewinner]||[])[0]}</span>`:gwzOk(1)):'<span class="muted">–</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Noch niemand dabei.</p>'}`}</div>
  <div class="card" style="margin-top:16px;border-color:#D9B45A"><div class="row between" style="flex-wrap:wrap;gap:10px"><h3 style="margin:0">Auslosung</h3><div class="row" style="gap:8px"><input type="number" id="gw-n" class="in" min="1" max="50" value="${Math.max(1,15-ok)}" style="width:80px"><button class="btn gold" onclick="gwzDraw($('gw-n').value,this)">Auslosen</button></div></div>
    <p class="muted" style="font-size:12.5px;margin:6px 0 12px">Gezogen wird nur aus dem Lostopf. Pro Gewinner etwa 30 Sekunden: Instagram öffnen → folgt er? Like da? Screenshot echt? Die 2 Markierten sind echte Profile? Passt etwas nicht → „Ungültig“ und einen Ersatz auslosen.</p>
    ${W.length?W.map((w,i)=>{ const t={...(byId[w.member_id]||{}),...w}; const s=stc[w.status]||['',''];
      return `<div class="item" style="align-items:center;gap:10px"><b style="width:26px">${i+1}.</b><div style="flex:1;min-width:0"><b>${esc(t.name||('Mitglied #'+w.member_id))}</b> <span class="muted" style="font-size:12px">${esc(t.email||'')}</span><div style="font-size:12px">${gwzIg(t.insta)} · ${t.lose||'?'} Lose · ${gwzShot(t.story_beweis)}</div><div style="font-size:12px" class="muted">Markiert: ${gwzMk(t.markiert)}</div></div>
        <span style="font-size:12px;font-weight:700;color:${s[1]}">${s[0]}</span>
        ${w.status==='gezogen'?`<button class="btn sm" onclick="gwzSet(${w.id},'bestaetigt')">✓ Bestätigen</button><button class="btn sm" style="color:#c0392b" onclick="gwzSet(${w.id},'ungueltig')">Ungültig</button>`:''}</div>`; }).join(''):'<p class="muted">Noch nicht ausgelost.</p>'}</div></div>`; };

async function mbDel(id){ const m=mbById(id); if(!m) return; const t=prompt(m.name+' endgültig löschen?\n\nDas löscht das Konto mit ALLEM: Beiträge, Kommentare, Chats, Bewerbungen, Punkte, Nachweise und den Einladungslink. Das kann man nicht rückgängig machen.\n\nZum Bestätigen tippe: LÖSCHEN'); if(t===null) return; if(t.trim().toUpperCase()!=='LÖSCHEN') return toast('Nicht gelöscht – Bestätigung falsch'); try{ const j=await q('rpc/member_loeschen',{method:'POST',body:{p_id:id}}); if(!j||!j.ok) throw 0; D.members=(D.members||[]).filter(x=>x.id!==id); mbSel=null; toast('Endgültig gelöscht'); location.hash='#member'; render(); }catch(e){ toast('Fehlt noch: closinghub-mitglieder.sql in Supabase ausführen'); } }

async function reload(){ LOADED=false; await render(); toast('Aktualisiert'); }
async function render(){
  const logged=!!SESSION;
  document.querySelector('.layout').style.gridTemplateColumns = logged ? '' : '1fr';
  $('side').style.display = logged ? '' : 'none';
  document.querySelectorAll('.top .search,.top .btn').forEach(x=>x.style.visibility = logged ? '' : 'hidden');
  if(!logged){ $('main').innerHTML=loginView(); return; }

    $('main').innerHTML='<div class="empty">Lade Daten …</div>';
    try{ await loadAll(); }catch(e){ if(!SESSION) return; $('main').innerHTML=`<div class="card empty">Daten konnten nicht geladen werden: ${esc(e.message)}<br><br><button class="btn" onclick="reload()">Nochmal versuchen</button> <button class="btn" onclick="logout()">Abmelden</button></div>`; return; }

  drawNav(); $('main').innerHTML=(PAGES[route()]||dashboard)();
}

  const DELAY=300, DUR=6000, FLICK=3000, END=DUR+FLICK;
  const ON=[[0,70],[150,210],[420,690],[760,800],[1080,1480],[1550,1590],[1800,2280],[2360,2400],[2480,3000]];
  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let data=null, W=0, H=0, done=false, t0=null;
  function setup(el){
    if(el._lg) return el._lg;
    const lit=el.querySelector('.lg-lit'), head=el.querySelector('.lg-head');
    [lit,head].forEach(c=>{ c.width=W; c.height=H; });
    el._lg={ lx:lit.getContext('2d'), hx:head.getContext('2d'), li:new ImageData(W,H), hi:new ImageData(W,H), fin:false };
    return el._lg;
  }
  function draw(el,t){
    const g=setup(el);
    if(g.fin) return;
    const p=Math.min(1,Math.max(0,t/DUR))*1.03, band=0.035, L=g.li.data, Hd=g.hi.data, final=t>=END;
    for(let i=0;i<W*H;i++){
      const a=data[i*4+3]; if(!a) continue;
      const pr=data[i*4]/255, k=i*4;
      if(pr<=p){ L[k]=L[k+1]=L[k+2]=255; L[k+3]=a; const h=final?0:Math.max(0,1-(p-pr)/band); Hd[k]=Hd[k+1]=Hd[k+2]=255; Hd[k+3]=a*h; }
      else { L[k+3]=0; Hd[k+3]=0; }
    }
    g.lx.putImageData(g.li,0,0); g.hx.putImageData(g.hi,0,0);
    const tt=t-DUR, hub=el.querySelector('.lg-hub');
    const on = tt>=FLICK || (tt>=0 && ON.some(([a,b])=>tt>=a&&tt<b));
    el.classList.toggle('hub-on', on);
    if(hub) hub.style.opacity = (tt>=0 && tt<FLICK && !on) ? (Math.random()<.3 ? .45 : .28) : '';
    if(final) g.fin=true;
  }
  function loop(now){
    if(t0===null) t0=now+DELAY;
    const t = reduced ? END : Math.max(0,now-t0);
    document.querySelectorAll('.lgi').forEach(el=>draw(el,t));
    if(t>=END){ done=true; return; }
    requestAnimationFrame(loop);
  }
  const img=new Image();
  img.onload=()=>{ const c=document.createElement('canvas'); W=c.width=img.width; H=c.height=img.height; const x=c.getContext('2d'); x.drawImage(img,0,0); data=x.getImageData(0,0,W,H).data; requestAnimationFrame(loop); };

  new MutationObserver(()=>{ if(done) document.querySelectorAll('.lgi').forEach(el=>{ if(!el._lg) draw(el,END); }); }).observe(document.documentElement,{childList:true,subtree:true});
