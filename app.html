document.addEventListener('click', e=>{
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if(!a) return;
  e.preventDefault();
  const h=a.getAttribute('href').slice(1);
  setTimeout(()=>go(h||'feed'),0); // erst inline-onclick (z. B. S.job=…) laufen lassen
}, true);

function toggleMode(){
  S.mode = S.mode==='consumer'?'auftraggeber':'consumer'; save();
  const o=document.createElement('div'); o.className='mode-ov';

}

// Player
const DUR = 8;
function startPlayer(i){ S.player={i, t:0, paused:false}; drawPlayer(); clearInterval(S.ptimer); S.ptimer=setInterval(tick,100); }
function stopPlayer(){ clearInterval(S.ptimer); S.player=null; }
const BREATH_AFTER = 300; // Sekunden Player-Zeit
S.watch = 0;
function tick(){ const p=S.player; if(!p||p.paused||S.breath) return; p.t+=0.1; S.watch+=0.1;
  if(S.watch>=BREATH_AFTER){ S.watch=0; return startBreath(); }
  if(p.t>=DUR){ p.t=0; updBar(); } else updBar(); }
function startBreath(){
  S.breath={left:30};
  const o=document.createElement('div'); o.id='breath'; o.className='breath-ov';
  o.innerHTML=`<p class="text-xs uppercase tracking-[.4em] text-muted">Kurze Pause</p>
    <div class="breath-wrap"><div class="breath-c"></div><p id="bphase" class="breath-t">Einatmen</p></div>
    <p class="text-sm text-muted">Atme mit dem Kreis – 30 Sekunden nur für dich.</p>
    <p id="bleft" class="font-serif text-gold text-2xl">30</p>`;
  document.body.appendChild(o);
  let t=0;
  const id=setInterval(()=>{ t+=0.1; const cyc=t%10; const ph=document.getElementById('bphase'); if(ph) ph.textContent = cyc<4?'Einatmen':(cyc<5?'Halten':'Ausatmen');

// Label passt sich in festes Feld ein (Breite = „Zitat“ in Maximalgröße), wie ein fixiertes Textfeld in Canva
const LABEL_MAX=44;
function fitLabel(){
  const el=document.getElementById('plabel'); if(!el) return;
  const css=`font-family:'Plus Jakarta Sans',sans-serif;font-style:italic;font-weight:700;letter-spacing:-.02em;white-space:nowrap`;
  const m=document.createElement('span'); m.style.cssText=`position:absolute;visibility:hidden;${css};font-size:${LABEL_MAX}px`; document.body.appendChild(m);
  const w=(t,fs)=>{ m.style.fontSize=fs+'px'; m.textContent=t; return m.offsetWidth; };
  const boxW=w('Zitat',LABEL_MAX);
  const txt=el.dataset.t||el.textContent; el.dataset.t=txt;
  let lines=[txt];
  if(w(txt,LABEL_MAX)>boxW){
    const cuts=[]; for(let i=1;i<txt.length;i++){ if(txt[i]==='-'||txt[i]===' ') cuts.push([txt.slice(0,i),txt.slice(i+1)]); }
    if(cuts.length){ cuts.sort((x,y)=>Math.abs(x[0].length-x[1].length)-Math.abs(y[0].length-y[1].length)); lines=cuts[0]; }
  }
  // einzeilig: max. Größe; zweizeilig: jede Zeile exakt auf Feldbreite skaliert
  const size = t => lines.length===1 ? Math.min(LABEL_MAX, LABEL_MAX*boxW/w(t,LABEL_MAX)) : Math.min(LABEL_MAX*1.5, LABEL_MAX*boxW/w(t,LABEL_MAX));
  el.style.width=boxW+'px'; el.style.display='block'; el.style.fontSize=''; el.style.transform='skewX(-9deg)'; el.style.transformOrigin='left bottom';
  el.innerHTML=lines.map(t=>`<span style="display:block;line-height:.95;font-size:${size(t).toFixed(1)}px">${t}</span>`).join('');
  m.remove();
  labelContrast(el);
}
// Helligkeit hinter dem Label messen → bei hellem Hintergrund schwarze Schrift
function labelContrast(el){
  const img=document.querySelector('#modal img.vidimg'); 
  const set=dark=>{ el.style.color = dark ? 'rgba(0,0,0,.55)' : 'rgba(255,255,255,.45)'; };
  if(!img){ set(false); return; }
  const run=()=>{ try{
    const c=document.createElement('canvas'), W=60, H=Math.round(60*img.naturalHeight/img.naturalWidth); c.width=W; c.height=H;
    const x=c.getContext('2d'); x.drawImage(img,0,0,W,H);
    const d=x.getImageData(0,0,Math.round(W*.5),Math.round(H*.15)).data; let L=0;
    for(let i=0;i<d.length;i+=4) L+=0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2];
    set(L/(d.length/4)/255>0.6);
  }catch(e){ set(false); } };
  img.complete?run():img.onload=run;
}

function toggleBadge(b){ S.badgesShown = S.badgesShown.includes(b)?S.badgesShown.filter(x=>x!==b):[...S.badgesShown,b]; }

let STT=null;
function openStory(i){ S.story={i,t:0}; drawStory(); clearInterval(STT); STT=setInterval(()=>{ if(!S.story) return clearInterval(STT); S.story.t+=0.1; if(S.story.t>=5){ nextStory(); } else { const b=document.getElementById('sb'+S.story.i); if(b) b.style.width=(S.story.t/5*100)+'%'; } },100); }
function nextStory(){ if(S.story.i>=STORIES.length-1){ clearInterval(STT); S.story=null; closeModal(); return; } S.story.i++; S.story.t=0; drawStory(); }
function prevStory(){ S.story.i=Math.max(0,S.story.i-1); S.story.t=0; drawStory(); }
function closeStory(){ clearInterval(STT); S.story=null; closeModal(); }
function drawStory(){
  const st=STORIES[S.story.i];
  document.getElementById('modal').innerHTML=`
  <div class="dark-zone fixed inset-0 z-50 bg-black flex items-center justify-center">
    <div class="relative w-full h-full md:max-w-sm md:h-[88vh] md:rounded-2xl overflow-hidden" style="background:${st.ad?'linear-gradient(160deg,#1a1a1d,#0A0A0B)':'linear-gradient(160deg,#2a2210,#0A0A0B 60%)'}">

      <div class="absolute top-6 left-4 right-12 z-10 flex items-center gap-2 text-sm">${st.ad?'<span class="text-[10px] uppercase tracking-wider border border-line rounded px-1.5 py-0.5 text-muted">Anzeige</span> <b>'+st.n+'</b>':'<span class="w-8 h-8 rounded-full overflow-hidden inline-block">'+avatar(st.n)+'</span>'+nameRank(st.n,st.r)}</div>
      <button onclick="closeStory()" class="absolute top-5 right-4 z-10 text-xl">✕</button>
      <div class="h-full flex flex-col items-center justify-center p-10 text-center gap-6 select-none" onclick="const x=event.clientX-this.getBoundingClientRect().left;(x>this.offsetWidth/2)?nextStory():prevStory()">

        ${st.ad?`<a href="#vorteile" onclick="event.stopPropagation();closeStory()" class="btn-gold">${st.cta}</a>`:''}
      </div>
      ${st.ad?'':`<div class="absolute bottom-0 inset-x-0 p-4 flex gap-3" onclick="event.stopPropagation()"><input class="input" placeholder="Glückwunsch senden…"><button class="text-gold">${svg('heart',26)}</button></div>`}
    </div></div>`;
}

function hashN(n){ let h=0; for(const c of n) h=(h*31+c.charCodeAt(0))>>>0; return h; }
function avatar(n){
  if(n===ME.name && S.avatar) return `<img src="${S.avatar}" class="w-full h-full rounded-full object-cover">`;
  const pi = (n in PHOTO_OF) ? PHOTO_OF[n] : 10;
  if(pi!==undefined) return `<img src="${PHOTOS[pi]}" alt="" class="w-full h-full rounded-full object-cover">`;
  const h=hashN(n);
  const bgs=[['#2b2416','#4a3a1c'],['#162430','#1f3a4d'],['#2a1a24','#4a2a3a'],['#1a2a20','#2c4a36'],['#241a30','#3a2a50'],['#2e2a22','#55493a']];
  const skins=['#f1d2b6','#e0b090','#c68a64','#a86d4a','#7a4b32','#f5dcc4'];
  const hairs=['#1b1410','#3a2416','#6b4423','#a9793f','#d8b77a','#2a2a2a','#7a2e1e'];
  const [b1,b2]=bgs[h%bgs.length], sk=skins[(h>>3)%skins.length], hc=hairs[(h>>6)%hairs.length], style=(h>>9)%5, beard=(h>>12)%4===0, glasses=(h>>14)%5===0;
  const hair=[
    `<path d="M30 42c0-14 9-22 20-22s20 8 20 22c-3-7-9-10-20-10s-17 3-20 10z" fill="${hc}"/>`,
    `<path d="M28 46c0-16 10-26 22-26s22 10 22 26v18c-4-4-5-12-5-20-6 2-28 2-34 0 0 8-1 16-5 20z" fill="${hc}"/>`,
    `<circle cx="50" cy="18" r="8" fill="${hc}"/><path d="M30 42c0-14 9-22 20-22s20 8 20 22c-4-6-10-9-20-9s-16 3-20 9z" fill="${hc}"/>`,
    `<path d="M29 44c-3-14 6-26 21-26s24 12 21 26c-2-4-4-6-6-7-3 3-27 3-30 0-2 1-4 3-6 7z" fill="${hc}"/><circle cx="33" cy="30" r="6" fill="${hc}"/><circle cx="67" cy="30" r="6" fill="${hc}"/><circle cx="50" cy="22" r="7" fill="${hc}"/>`,
    `<path d="M31 40c1-12 9-19 19-19s18 7 19 19c-6-3-12-4-19-4s-13 1-19 4z" fill="${hc}"/>`][style];
  return `<svg viewBox="0 0 100 100" class="w-full h-full rounded-full"><defs><linearGradient id="g${h}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${b2}"/><stop offset="1" stop-color="${b1}"/></linearGradient></defs>
    <rect width="100" height="100" fill="url(#g${h})"/>
    <path d="M16 100c2-20 16-30 34-30s32 10 34 30z" fill="${['#1c1c1f','#2b2b33','#3a2f1e','#1e2b3a','#2e1e2a'][(h>>16)%5]}"/>
    <rect x="44" y="58" width="12" height="14" rx="5" fill="${sk}"/>
    <ellipse cx="50" cy="45" rx="17" ry="20" fill="${sk}"/>
    ${beard?`<path d="M34 50c2 12 8 18 16 18s14-6 16-18c-4 6-10 8-16 8s-12-2-16-8z" fill="${hc}"/>`:''}
    ${hair}
    ${glasses?`<g fill="none" stroke="#111" stroke-width="1.6"><circle cx="43" cy="46" r="5"/><circle cx="57" cy="46" r="5"/><path d="M48 46h4"/></g>`:''}
  </svg>`;
}


// Player-Menü (gilt nur für diese Sitzung – verschwindet beim Schließen der App)
function playerMenu(){
  const sel = S.ptopics || [...FTOPICS];
  document.getElementById('modal').innerHTML = `
  <div class="fixed inset-0 z-50 flex items-end md:items-center justify-center p-0 md:p-4" style="background:rgba(8,8,9,.72);backdrop-filter:blur(8px)" onclick="closeModal()">
    <div class="w-full md:max-w-md p-6 space-y-6 relative rounded-t-3xl md:rounded-3xl" style="background:linear-gradient(180deg,rgb(var(--sheet1)),rgb(var(--sheet2)));border:1px solid rgb(var(--line));box-shadow:0 -10px 40px rgba(0,0,0,.6)" onclick="event.stopPropagation()">
      <div class="w-10 h-1 rounded-full bg-line mx-auto md:hidden -mt-2"></div>
      <button onclick="closeModal()" class="absolute top-4 right-5 text-muted hover:text-white text-xl">✕</button>
      <div class="flex items-center gap-3">${ic('gearplay')}<div><p style="font-family:Cinzel,serif;letter-spacing:.18em" class="text-gold text-sm">FEED & PLAYER</p><p class="text-xs text-muted">Passt Feed und Player an · gilt nur für diese Sitzung</p></div></div>
      <div><p class="text-xs uppercase tracking-[.25em] text-muted mb-3">Was willst du sehen?</p>
        <div class="grid grid-cols-2 gap-2">${FTOPICS.map(t=>`<button onclick="toggleP('${t}')" class="flex items-center gap-2 text-left text-sm px-3 py-2.5 rounded-xl border transition" style="${sel.includes(t)?'border-color:#A97C22;background:rgb(var(--chip))':'border-color:rgb(var(--line))'}"><span class="w-4 h-4 rounded-full flex items-center justify-center text-[10px]" style="${sel.includes(t)?'background:#D4A843;color:#000':'border:1px solid #55575d'}">${sel.includes(t)?'✓':''}</span>${t}</button>`).join('')}</div></div>
      <div><p class="text-xs uppercase tracking-[.25em] text-muted mb-3">App schließen nach</p>
        <div class="grid grid-cols-4 gap-2">${[0,5,10,15].map(m=>`<button onclick="S.timerMin=${m};playerMenu()" class="py-2.5 rounded-xl border text-sm" style="${(S.timerMin||0)===m?'border-color:#D4A843;color:#F3D58A;background:rgb(var(--chip))':'border-color:rgb(var(--line));color:#8A8A93'}">${m?m+' Min.':'Aus'}</button>`).join('')}</div></div>
      <div class="grid grid-cols-2 gap-2"><button class="btn-ghost !py-3" onclick="closeModal();render()">Feed anpassen</button><button class="btn-gold !py-3" onclick="startFromMenu()">▶︎ Player starten</button></div>
    </div></div>`;
}
function toggleP(t){ let cur=S.ptopics||[...FTOPICS]; cur=cur.includes(t)?cur.filter(x=>x!==t):[...cur,t]; if(!cur.length) return; S.ptopics=cur.length===FTOPICS.length?null:cur; playerMenu(); render(); }
function startFromMenu(){
  S.plist = S.ptopics ? POSTS.filter(p=>S.ptopics.includes(p.k)) : null;
  if(S.timerMin){ S.timerEnd = Date.now()+S.timerMin*60000; } else S.timerEnd=null;
  render(); startPlayer(0);

  return `<div class="px-4 py-6 max-w-6xl mx-auto">

    ${!S.wide?scarcity(slots):''}

      ${shown.length?shown.map(o=>`<div class="card p-5 flex flex-col">

        <div class="flex justify-between items-center mt-4"><span class="font-serif text-2xl text-gold">${o.pr} €</span><button onclick="${S.user?`buyModal('${o.t.replace(/'/g,'')}',${o.pr})`:`go('login')`}" class="btn-ghost text-sm">Kaufen</button></div>
      </div>`).join(''):`<div class="card p-6 text-muted text-sm">Noch keine Angebote in ${S.region}. ${S.user?'Sei der Erste und sichere dir einen der 10 Plätze!':''} Tipp: „Ganzes Land durchsuchen“ aktivieren.</div>`}
    </div>
    <p class="text-xs text-muted mt-6">Käufe laufen sicher über ClosingHub. Verkäufer werden nach jedem Kauf bewertet. ClosingHub-Gebühr: 9,9 % pro Verkauf.</p>
  </div>`;
}
function scarcity(slots){
  const hot = MCATS.map(c=>[c,10-slots(c)]).filter(([c,f])=>f>0&&f<=3);
  const full = MCATS.filter(c=>slots(c)>=10);
  if(!hot.length&&!full.length) return '';
  return `<div class="card p-4 mb-5 flex flex-wrap gap-2 items-center" style="border-color:#A97C22"><span class="text-gold font-semibold text-sm">Plätze werden knapp in ${S.region}:</span>
    ${hot.map(([c,f])=>`<button onclick="S.mcat='${c}';render()" class="text-xs px-3 py-1 rounded-full border" style="border-color:#D4A843;color:#F3D58A">🔥 ${c}: nur noch ${f} ${f===1?'Platz':'Plätze'}</button>`).join('')}
    ${full.map(c=>`<span class="text-xs px-3 py-1 rounded-full border border-line text-muted">${c}: voll · Warteliste</span>`).join('')}</div>`;
}

  const r=route();
