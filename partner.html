<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partnerportal – ClosingHub</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Lora:wght@500;600&family=Parisienne&family=Bebas+Neue&display=swap">
<style>
:root{--paper:#F2F4F1;--sheet:#FFFFFF;--ink:#0E1A2B;--ink-2:#4A5568;--ink-3:#6B7584;--rule:#D5DAD3;--tint:#E4E8E2;--deal:#087A4B;--deal-press:#06603B;--deal-soft:#E3F1EA;--seal:#B8860B;--err:#B42318}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Archivo,system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--deal)}
.top{background:rgba(242,244,241,.94);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:20}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:62px}
.logo{display:inline-flex;align-items:baseline;text-decoration:none;color:var(--ink);line-height:1}
.logo .l1{font-family:Parisienne,cursive;font-size:30px;margin-right:2px}
.logo .l2{font-family:"Bebas Neue",sans-serif;font-size:31px;letter-spacing:.01em}
.tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
main{padding:28px 0 80px}
h1{font-family:Lora,Georgia,serif;font-weight:600;font-size:clamp(28px,5vw,38px);line-height:1.15;margin:0 0 6px;text-wrap:balance}
h2{font-family:Lora,Georgia,serif;font-weight:600;font-size:21px;margin:0 0 4px}
.sub{color:var(--ink-2);margin:0 0 22px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:20px;margin-top:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
label.f{display:block;font-size:13px;color:var(--ink-2)}
.in{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-size:15px}
.in:focus-visible,.btn:focus-visible,a:focus-visible{outline:2px solid var(--deal);outline-offset:2px}
textarea.in{resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--rule);background:#fff;color:var(--ink);font:inherit;font-weight:700;font-size:15px;padding:10px 16px;border-radius:8px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn.go{background:var(--deal);border-color:var(--deal);color:#fff}
.btn.go:hover{background:var(--deal-press)}
.btn.sm{padding:7px 12px;font-size:14px}
.btn[disabled]{opacity:.6;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink-3);font-size:13px}
.note{border-radius:10px;padding:12px 14px;font-size:14px;margin-top:14px}
.note.wait{background:#FBF3DC;border:1px solid #E9D69A;color:#5F4708}
.note.ok{background:var(--deal-soft);border:1px solid #B9DFCB;color:var(--deal-press)}
.note.bad{background:#FDECEA;border:1px solid #F3C1BB;color:var(--err)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;border:1px solid var(--rule);white-space:nowrap}
.pill.ok{background:var(--deal-soft);border-color:#B9DFCB;color:var(--deal-press)}
.pill.wait{background:#FBF3DC;border-color:#E9D69A;color:#5F4708}
.guest{border-top:1px solid var(--rule);padding-top:12px;margin-top:12px}
.photo{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--tint)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:92vw}
#toast.show{opacity:1;transform:translateX(-50%)}
.auth{max-width:420px;margin:40px auto 0}
.nav{display:flex;gap:6px;margin:4px 0 2px;overflow-x:auto;padding-bottom:4px}
.nav button{border:1px solid var(--rule);background:#fff;color:var(--ink-2);font:inherit;font-weight:700;font-size:14px;padding:9px 14px;border-radius:99px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.nav button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.nav .cnt{background:var(--deal);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px}
.sec{display:none}.sec.on{display:block}
.offer{display:grid;grid-template-columns:34px 1fr 150px 38px;gap:10px;align-items:end;border:1px solid var(--rule);border-radius:12px;padding:12px;margin-top:10px;background:#fff}
.offer .no{width:34px;height:34px;border-radius:50%;background:var(--deal-soft);color:var(--deal-press);font-weight:800;display:grid;place-items:center;margin-bottom:3px}
.offer .eur{position:relative}.offer .eur span{position:absolute;right:12px;bottom:10px;color:var(--ink-3)}.offer .eur .in{padding-right:30px}
.offer .del{width:38px;height:42px;border:1px solid var(--rule);border-radius:8px;background:#fff;color:var(--ink-3);font-size:18px;cursor:pointer}
.offer .del:hover{border-color:var(--err);color:var(--err)}
.add{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:10px;padding:16px;border:2px dashed var(--rule);border-radius:12px;background:transparent;color:var(--deal);font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.add:hover{border-color:var(--deal);background:var(--deal-soft)}
.add .plus{width:28px;height:28px;border-radius:50%;background:var(--deal);color:#fff;display:grid;place-items:center;font-size:20px;line-height:1}
@media(max-width:640px){.offer{grid-template-columns:34px 1fr 38px}.offer label.f:not(.eur){grid-column:2/-1}.offer .eur{grid-column:2/3}}
.box2{display:grid;grid-template-columns:240px 1fr;gap:14px;margin-top:14px}
@media(max-width:700px){.box2{grid-template-columns:1fr}}
.thr{display:block;width:100%;text-align:left;border:1px solid var(--rule);background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font:inherit;color:var(--ink)}
.thr.on{border-color:var(--ink);background:var(--tint)}
.thr small{display:block;color:var(--ink-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat{border:1px solid var(--rule);border-radius:12px;padding:12px;max-height:380px;overflow:auto;background:var(--paper)}
.msg{max-width:82%;background:#fff;border:1px solid var(--rule);border-radius:12px;padding:8px 12px;margin-bottom:8px;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{margin-left:auto;background:var(--deal-soft);border-color:#B9DFCB}
.msg small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:3px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1}
.tabs .on{background:var(--ink);border-color:var(--ink);color:#fff}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="/" aria-label="ClosingHub Startseite"><span class="l1">closing</span><span class="l2">HUB</span></a>
  <div class="row"><span class="tag">Partnerportal</span><button class="btn sm" id="out" style="display:none" onclick="logout()">Abmelden</button></div>
</div></header>
<main><div class="wrap" id="main"></div></main>
<div id="toast" role="status"></div>

<script>
const SB_URL='https://bzcnqggwyfocpbkwqhsy.supabase.co', SB_KEY='sb_publishable_97FHvL7dI_g9ueRVwfhE6A_qv07CJ6D';
const SKEY='ch_partner_session', TKEY='ch_partner_einladung';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean=x=>String(x||'').replace(/[<>"'`]/g,'').trim();
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),3200); }
const store={ get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ v===null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} } };

let SESSION=null; try{ SESSION=JSON.parse(store.get(SKEY)); }catch(e){}
const keep=s=>{ SESSION=s; store.set(SKEY, s?JSON.stringify(s):null); };
let ME=null, GUESTS=[], authMode='login', MSG='';
let TAB='profil', KONTAKT, MSGS, THREAD=null;   // KONTAKT/MSGS bleiben undefined, solange die Datenbank dafür noch nicht eingerichtet ist

// Einladungslink merken, bis das Konto angemeldet ist
(function(){ const t=new URLSearchParams(location.search).get('einladung'); if(t&&/^[a-f0-9]{16,40}$/.test(t)){ store.set(TKEY,t); history.replaceState(null,'',location.pathname); } })();

async function authCall(path, body){
  const r=await fetch(`${SB_URL}/auth/v1/${path}`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description||j.msg||j.message||'Das hat nicht geklappt');
  return j;
}
function takeSession(j){ if(!j||!j.access_token) return false; keep({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||(Date.now()/1000+(j.expires_in||3600)),email:j.user&&j.user.email}); return true; }
async function refresh(){ takeSession(await authCall('token?grant_type=refresh_token',{refresh_token:SESSION.refresh_token})); }
async function api(path,{method='GET',body,prefer}={},retry=true){
  if(SESSION && SESSION.expires_at-60<Date.now()/1000){ try{ await refresh(); }catch(e){ logout(); throw e; } }
  const headers={apikey:SB_KEY,'Content-Type':'application/json'};
  if(SESSION) headers.Authorization='Bearer '+SESSION.access_token;
  if(prefer) headers.Prefer=prefer;
  const r=await fetch(`${SB_URL}/rest/v1/${path}`,{method,headers,body:body!==undefined?JSON.stringify(body):undefined});
  if(r.status===401&&retry&&SESSION){ try{ await refresh(); return api(path,{method,body,prefer},false); }catch(e){ logout(); throw e; } }
  if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.message||('Fehler '+r.status)); }
  const t=await r.text(); return t?JSON.parse(t):null;
}
function logout(){ keep(null); ME=null; GUESTS=[]; render._loaded=false; render(); }

/* ===== Anmelden und Passwort festlegen ===== */
let INVITE=null;   // {name,email} wenn ein gültiger Einladungslink geöffnet wurde
async function checkInvite(){
  const t=store.get(TKEY); if(!t||SESSION) return;
  try{ const r=await fetch(`${SB_URL}/rest/v1/rpc/partner_einladung`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t})}); const j=r.ok?await r.json():null;
    if(j&&j.ok){ INVITE={name:j.name||'',email:String(j.email||'').toLowerCase()}; authMode='welcome'; }
    else if(j&&!j.ok){ store.set(TKEY,null); MSG=['wait','Dieser Einladungslink wurde schon eingelöst oder ist nicht mehr gültig. Wenn du bereits ein Passwort gewählt hast, melde dich einfach an.']; authMode='login'; }
  }catch(e){}
}
function authView(){
  if(authMode==='welcome'&&INVITE) return `<div class="auth"><h1>Willkommen${INVITE.name?', '+esc(INVITE.name):''}</h1>
    <p class="sub">Du bist als Partner von ClosingHub eingeladen. Wähle jetzt ein Passwort, dann bist du direkt in deinem Partnerportal.</p>
    <div class="card"><form onsubmit="doWelcome(event)">
        <label class="f">Deine E-Mail-Adresse<input class="in" id="w-mail" type="email" required value="${esc(INVITE.email)}" ${INVITE.email?'readonly style="background:var(--tint);color:var(--ink-2)"':''} autocomplete="username"></label>
        <label class="f" style="margin-top:10px">Passwort wählen (mindestens 8 Zeichen)<input class="in" id="w-pw" type="password" required minlength="8" autocomplete="new-password"></label>
        <label class="f" style="margin-top:10px">Passwort wiederholen<input class="in" id="w-pw2" type="password" required minlength="8" autocomplete="new-password"></label>
        <button class="btn go" id="a-btn" style="width:100%;margin-top:14px">Passwort festlegen und loslegen</button>
      </form>
      ${MSG?`<div class="note ${MSG[0]}">${esc(MSG[1])}</div>`:''}
      <p class="muted" style="margin-top:12px">Später meldest du dich mit dieser E-Mail-Adresse und deinem Passwort an. <a href="#" onclick="authMode='login';MSG='';render();return false">Ich habe schon ein Passwort</a></p></div></div>`;
  return `<div class="auth"><h1>Partnerportal</h1>
    <p class="sub">Melde dich mit deiner E-Mail-Adresse und deinem Passwort an.</p>
    <div class="card"><form onsubmit="doLogin(event)">
        <label class="f">E-Mail-Adresse<input class="in" id="a-mail" type="email" required autocomplete="username" value="${esc(INVITE?INVITE.email:'')}"></label>
        <label class="f" style="margin-top:10px">Passwort<input class="in" id="a-pw" type="password" required autocomplete="current-password"></label>
        <button class="btn go" id="a-btn" style="width:100%;margin-top:14px">Anmelden</button>
      </form>
      ${MSG?`<div class="note ${MSG[0]}">${esc(MSG[1])}</div>`:''}
      <p class="muted" style="margin-top:12px">Zugang gibt es nur über eine persönliche Einladung von ClosingHub. Passwort vergessen? Schreib an <a href="mailto:support@getclosinghub.com">support@getclosinghub.com</a>.</p></div></div>`;
}
function authFail(e){ const m=String(e.message||'');
  MSG=['bad',/invalid login/i.test(m)?'E-Mail oder Passwort falsch.':/not confirmed/i.test(m)?'Bitte bestätige zuerst den Link in der E-Mail, die wir dir geschickt haben.':m]; render(); }
async function doWelcome(ev){
  ev.preventDefault(); const pw=$('w-pw').value; if(pw!==$('w-pw2').value){ MSG=['bad','Die beiden Passwörter stimmen nicht überein.']; return render(); }
  $('a-btn').disabled=true;
  try{
    INVITE.email=$('w-mail').value.trim().toLowerCase();
    const j=await authCall('signup',{email:INVITE.email,password:pw});
    if(!takeSession(j)){ MSG=['ok','Fast geschafft: Wir haben dir zur Sicherheit eine E-Mail geschickt. Bestätige den Link darin und melde dich danach hier mit deinem Passwort an.']; authMode='login'; return render(); }
    MSG=''; ME=null; render._loaded=false; await render();
  }catch(e){
    if(/already registered|already been registered/i.test(String(e.message||''))){ MSG=['wait','Für diese E-Mail-Adresse gibt es schon ein Passwort. Melde dich damit an.']; authMode='login'; return render(); }
    authFail(e);
  }
}
async function doLogin(ev){
  ev.preventDefault(); const email=$('a-mail').value.trim().toLowerCase(), password=$('a-pw').value; $('a-btn').disabled=true;
  try{ takeSession(await authCall('token?grant_type=password',{email,password})); MSG=''; ME=null; render._loaded=false; await render(); }
  catch(e){ authFail(e); }
}

/* ===== Daten ===== */
async function load(){
  const t=store.get(TKEY);
  if(t){ const j=await api('rpc/partner_beitreten',{method:'POST',body:{p_token:t}}).catch(()=>null); if(j&&j.ok) store.set(TKEY,null); else if(j&&j.grund==='link'){ store.set(TKEY,null); toast('Die Einladung passt nicht zu diesem Konto oder ist nicht mehr gültig.'); } }
  const rows=await api('partners?select=id,status,profile,draft,draft_at&limit=1'); ME=rows&&rows[0]||null;
  GUESTS=ME&&ME.status==='aktiv'?(await api('partner_guests?select=*&order=slot.asc').catch(()=>[]))||[]:[];
  KONTAKT=undefined; MSGS=undefined;
  if(ME&&ME.status==='aktiv'){
    try{ const k=await api(`partners?select=kontakt&id=eq.${ME.id}`); KONTAKT=(k&&k[0]&&k[0].kontakt)||{}; }catch(e){}
    try{ MSGS=(await api('partner_messages?select=*&order=created_at.asc'))||[]; }catch(e){}
  }
}

/* ===== Portal ===== */
function fld(k,l,ph,v){ return `<label class="f">${l}<input class="in" data-f="${k}" value="${esc(v||'')}" placeholder="${esc(ph||'')}"></label>`; }
function portal(){
  if(!ME) return `<h1>Kein Partnerzugang</h1><p class="sub">Mit diesem Konto ist kein Partnerplatz verknüpft. Nutze bitte die E-Mail-Adresse, an die deine Einladung ging, oder öffne den Link aus der Einladung noch einmal.</p>`;
  if(ME.status==='beendet') return `<h1>Partnerschaft beendet</h1><p class="sub">Deine Partnerschaft mit ClosingHub ist beendet. Dein Partnerprofil ist nicht mehr sichtbar. Bei Fragen schreib an <a href="mailto:support@getclosinghub.com">support@getclosinghub.com</a>.</p>`;
  const p=ME.draft||ME.profile||{}, k=p.k||[], d=p.deal||[];
  const sec=(id,html)=>`<section class="sec ${TAB===id?'on':''}" data-sec="${id}">${html}</section>`;
  const send=`<div class="row" style="margin-top:16px"><button class="btn go" onclick="sendProfile(this)">Änderung zur Freigabe senden</button><span class="muted">Profil und Angebote werden zusammen gesendet.</span></div>`;
  return `<h1>Hallo ${esc((ME.profile&&ME.profile.n)||p.n||'')}</h1><p class="sub">Dein Partnerbereich bei ClosingHub.</p>
  <div class="nav" id="nav">${navHtml()}</div>
  <div class="card" style="margin-top:10px"><div class="row" style="justify-content:space-between"><div style="min-width:0;flex:1"><b>Dein Empfehlungslink</b><p class="muted" style="overflow-wrap:anywhere">${myLink()}</p></div><button class="btn sm go" onclick="copyMyLink()">Link kopieren</button></div>
    <p class="muted" style="margin-top:6px">Wer sich über diesen Link bei ClosingHub einträgt, wird dir zugeordnet. Teile ihn in Storys, Reels oder Nachrichten.</p></div>
  ${sec('profil',`${ME.draft?`<div class="note wait">Deine letzte Änderung wartet auf Freigabe. Du kannst sie hier weiter anpassen und erneut senden.</div>`:(ME.profile&&ME.profile.s?`<div class="note ok">Dein Profil ist live in der App.</div>`:`<div class="note wait">Dein Profil ist noch nicht ausgefüllt. Trag deine Angaben ein und sende sie zur Freigabe.</div>`)}
  <div class="card"><h2>Dein Profil</h2><p class="muted">Pflicht sind nur dein Name und wofür du Partner bist. Leere Felder erscheinen im Profil nicht. Änderungen prüft ClosingHub kurz, danach sind sie in der App sichtbar.</p>
    <div class="row" style="margin:14px 0"><img class="photo" id="p-img" src="${esc(p.img||'')}" alt="" style="${p.img?'':'visibility:hidden'}">
      <label class="btn sm" style="cursor:pointer">Foto auswählen<input type="file" accept="image/*" style="display:none" onchange="pickPhoto(this)"></label><input type="hidden" data-f="img" value="${esc(p.img||'')}"></div>
    <div class="grid">
      ${fld('n','Name','Paul',p.n)}${fld('s','Wofür du Partner bist (steht groß im Profilkopf)','Morgen-Call',p.s)}
      ${fld('role','Beruf oder Rolle','Mindset-Coach',p.role)}${fld('meta','Erfahrung und Land (optional)','8 Jahre Vertrieb, Deutschland',p.meta)}
      ${fld('bk','Text auf dem grünen Knopf','Coaching anfragen',p.bk)}${fld('live','Hinweis auf deine Live-Termine (optional)','Mo–Do, 7:30 Uhr live in der App',p.live)}
      ${fld('k0','Zahl, mit der du überzeugst (optional)','312',k[0])}${fld('k1','Was die Zahl bedeutet','Calls analysiert',k[1])}
      ${fld('d0','Rabatt für Member (optional)','−20 % für Member',d[0])}${fld('d1','Worauf der Rabatt gilt','auf das erste Coaching',d[1])}
      ${fld('d2','Rabattcode','PAUL20',d[2])}
    </div>
    <label class="f" style="margin-top:12px">Kurze Vorstellung in ein bis zwei Sätzen<textarea class="in" data-f="bio" rows="3" maxlength="300">${esc(p.bio||'')}</textarea></label>
    <label class="row muted" style="margin-top:12px"><input type="checkbox" data-f="fem" ${p.fem?'checked':''}> Im Profil „Partnerin“ statt „Partner“ schreiben</label>
    ${send}</div>`)}
  ${sec('angebote',`<div class="card"><h2>Deine Angebote für Member</h2><p class="muted">Bis zu ${MAXO} Angebote mit Titel und Preis. Sie erscheinen in deinem Profil in der App, sobald ClosingHub die Änderung freigegeben hat.</p>
    <div id="offers">${offersHtml((p.offers||[]).slice(0,MAXO))}</div>
    ${send}</div>`)}
  ${sec('postfach',`<div class="card" id="postfach">${postfachHtml()}</div>`)}
  ${sec('gaeste',`<div class="card"><h2>Deine Gäste</h2><p class="muted">Du kannst bis zu drei Personen einladen. Sie bekommen die Plus-Mitgliedschaft kostenlos, solange deine Partnerschaft besteht.</p>
    ${[1,2,3].map(guestRow).join('')}</div>`)}
  ${sec('kontakt',`<div class="card">${kontaktHtml()}</div>`)}`;
}
const myLink=()=>'https://www.getclosinghub.com/?partner='+ME.id;
async function copyMyLink(){ try{ await navigator.clipboard.writeText(myLink()); toast('Empfehlungslink kopiert'); }catch(e){ prompt('Dein Empfehlungslink:',myLink()); } }
/* ===== Reiter ===== */
const kontaktFehlt=()=>KONTAKT!==undefined&&!['strasse','plz','ort','land','tel','mail'].every(x=>(KONTAKT||{})[x]);
function navHtml(){
  const n=MSGS?threads().reduce((a,t)=>a+unread(t),0):0;
  return [['profil','Profil'],['angebote','Angebote'],['postfach','Postfach'+(n?` <span class="cnt">${n}</span>`:'')],['gaeste','Gäste'],['kontakt','Kontaktdaten'+(kontaktFehlt()?' <span class="cnt" style="background:var(--seal)">!</span>':'')]]
    .map(([id,l])=>`<button type="button" class="${TAB===id?'on':''}" onclick="showTab('${id}')">${l}</button>`).join('');
}
function showTab(t){ TAB=t; document.querySelectorAll('.sec').forEach(x=>x.classList.toggle('on',x.dataset.sec===t)); $('nav').innerHTML=navHtml(); }

/* ===== Angebote ===== */
const MAXO=3;
function offersHtml(list){
  return list.map((o,i)=>`<div class="offer"><div class="no">${i+1}</div>
      <label class="f">Titel des Angebots<input class="in" data-o="t" maxlength="70" value="${esc(o.t||'')}" placeholder="1:1 Mindset-Coaching (60 Min.)"></label>
      <label class="f eur">Preis<input class="in" data-o="pr" maxlength="12" inputmode="decimal" value="${esc(o.pr||'')}" placeholder="89"><span>€</span></label>
      <button type="button" class="del" title="Angebot entfernen" aria-label="Angebot ${i+1} entfernen" onclick="delOffer(${i})">×</button></div>`).join('')
    + (list.length<MAXO?`<button type="button" class="add" onclick="addOffer()"><span class="plus">+</span>Angebot hinzufügen <span class="muted">(${list.length} von ${MAXO})</span></button>`
       :`<p class="muted" style="margin-top:10px">Du hast alle ${MAXO} Angebote belegt. Entferne eines, um ein neues anzulegen.</p>`);
}
function readOffers(){ return [...document.querySelectorAll('#offers .offer')].map(r=>({t:clean(r.querySelector('[data-o="t"]').value).slice(0,70),pr:clean(r.querySelector('[data-o="pr"]').value).slice(0,12)})); }
function addOffer(){ const l=readOffers(); if(l.length>=MAXO) return; l.push({t:'',pr:''}); $('offers').innerHTML=offersHtml(l); const f=document.querySelectorAll('#offers [data-o="t"]'); f[f.length-1].focus(); }
function delOffer(i){ const l=readOffers(); if(l[i]&&l[i].t&&!confirm('Dieses Angebot entfernen?')) return; l.splice(i,1); $('offers').innerHTML=offersHtml(l); }

/* ===== Kontaktdaten (nur für ClosingHub, nicht im Profil) ===== */
function kontaktHtml(){
  if(KONTAKT===undefined) return `<h2>Kontaktdaten</h2><div class="note wait">Dieser Bereich wird gerade eingerichtet und ist in Kürze verfügbar.</div>`;
  const c=KONTAKT||{}, f=(k,l,ph,v,type)=>`<label class="f">${l}<input class="in" data-c="${k}" type="${type||'text'}" value="${esc(v||'')}" placeholder="${esc(ph||'')}"></label>`;
  return `<h2>Kontaktdaten</h2><p class="muted">Diese Angaben sieht nur ClosingHub, zum Beispiel für Vertrag und Abrechnung. Sie erscheinen nicht in deinem Profil.</p>
    ${kontaktFehlt()?`<div class="note wait">Bitte trag deine vollständigen Kontaktdaten ein.</div>`:''}
    <div class="grid" style="margin-top:14px">
      ${f('firma','Firma (optional)','Musterfirma GmbH',c.firma)}${f('strasse','Straße und Hausnummer','Musterstraße 12',c.strasse)}
      ${f('plz','Postleitzahl','80331',c.plz)}${f('ort','Ort','München',c.ort)}
      ${f('land','Land','Deutschland',c.land)}${f('tel','Telefonnummer','+49 170 1234567',c.tel,'tel')}
      ${f('mail','E-Mail-Adresse','name@beispiel.de',c.mail||(SESSION&&SESSION.email)||'','email')}
    </div>
    <div class="row" style="margin-top:16px"><button class="btn go" onclick="saveKontakt(this)">Kontaktdaten speichern</button></div>`;
}
async function saveKontakt(b){
  const g=k=>clean((document.querySelector(`[data-c="${k}"]`)||{}).value), c={firma:g('firma').slice(0,120),strasse:g('strasse').slice(0,120),plz:g('plz').slice(0,12),ort:g('ort').slice(0,80),land:g('land').slice(0,60),tel:g('tel').slice(0,30),mail:g('mail').slice(0,120).toLowerCase()};
  if(!c.strasse||!c.plz||!c.ort||!c.land) return toast('Bitte die vollständige Anschrift eintragen');
  if(c.tel.replace(/\D/g,'').length<6) return toast('Bitte eine gültige Telefonnummer eintragen');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.mail)) return toast('Bitte eine gültige E-Mail-Adresse eintragen');
  b.disabled=true;
  try{ const j=await api('rpc/partner_kontakt',{method:'POST',body:{p:c}}); if(!j||!j.ok) throw new Error('Speichern nicht möglich'); KONTAKT=c; $('nav').innerHTML=navHtml(); document.querySelector('[data-sec="kontakt"] .card').innerHTML=kontaktHtml(); toast('Kontaktdaten gespeichert'); }
  catch(e){ toast('Das hat nicht geklappt: '+e.message); b.disabled=false; }
}

/* ===== Postfach: geschäftliche Anfragen von Mitgliedern ===== */
function threads(){
  const m={}; (MSGS||[]).forEach(x=>{ const t=m[x.member_id]=m[x.member_id]||{id:x.member_id,name:'Mitglied',msgs:[]}; t.msgs.push(x); if(x.member_name) t.name=x.member_name; });
  return Object.values(m).sort((a,b)=>String(b.msgs[b.msgs.length-1].created_at).localeCompare(String(a.msgs[a.msgs.length-1].created_at)));
}
const unread=t=>t.msgs.filter(x=>x.von==='member'&&!x.read_at).length;
const when=iso=>{ const d=new Date(iso); return isNaN(d)?'':d.toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); };
function postfachHtml(){
  const head=`<h2>Postfach</h2><p class="muted">Nur für geschäftliche Anfragen. Mitglieder schreiben dich über dein Profil in der App an, du antwortest hier. Du kannst niemanden zuerst anschreiben.</p>`;
  if(MSGS===undefined) return head+`<div class="note wait">Das Postfach wird gerade eingerichtet und ist in Kürze verfügbar.</div>`;
  const th=threads(); if(!th.length) return head+`<div class="note ok">Noch keine Anfragen. Sobald Mitglieder dich in der App anschreiben, landen ihre Nachrichten hier.</div>`;
  const cur=th.find(t=>t.id===THREAD);
  return head+`<div class="box2"><div>${th.map(t=>{ const l=t.msgs[t.msgs.length-1], u=unread(t); return `<button type="button" class="thr ${cur&&cur.id===t.id?'on':''}" onclick="openThread('${esc(t.id)}')"><b>${esc(t.name)}</b>${u?` <span class="pill ok">${u} neu</span>`:''}<small>${l.von==='partner'?'Du: ':''}${esc(l.text)}</small></button>`; }).join('')}</div>
    <div>${cur?`<div class="chat" id="chat">${cur.msgs.map(x=>`<div class="msg ${x.von==='partner'?'me':''}">${esc(x.text)}<small>${x.von==='partner'?'Du':esc(cur.name)} · ${when(x.created_at)}</small></div>`).join('')}</div>
      <textarea class="in" id="pm-text" rows="3" maxlength="2000" style="margin-top:10px" placeholder="Antwort an ${esc(cur.name)} …"></textarea>
      <div class="row" style="margin-top:10px;justify-content:flex-end"><button class="btn go" onclick="sendMsg(this)">Antwort senden</button></div>`
      :`<p class="muted" style="margin-top:8px">Wähle links eine Anfrage aus.</p>`}</div></div>`;
}
function drawPostfach(){ $('postfach').innerHTML=postfachHtml(); $('nav').innerHTML=navHtml(); const c=$('chat'); if(c) c.scrollTop=c.scrollHeight; }
async function openThread(id){
  THREAD=id; const open=(MSGS||[]).filter(x=>x.member_id===id&&x.von==='member'&&!x.read_at);
  if(open.length){ const now=new Date().toISOString(); open.forEach(x=>x.read_at=now); api('rpc/partner_gelesen',{method:'POST',body:{p_member:id}}).catch(()=>{}); }
  drawPostfach();
}
async function sendMsg(b){
  const text=($('pm-text').value||'').trim().slice(0,2000); if(!text) return toast('Bitte eine Nachricht schreiben');
  b.disabled=true;
  try{ const rows=await api('partner_messages',{method:'POST',prefer:'return=representation',body:{partner_id:ME.id,member_id:THREAD,von:'partner',text}}); if(rows&&rows[0]) MSGS.push(rows[0]); drawPostfach(); toast('Gesendet'); }
  catch(e){ toast('Das hat nicht geklappt: '+e.message); b.disabled=false; }
}
function readProfile(){
  const g=k=>{ const el=document.querySelector(`[data-f="${k}"]`); return el?(el.type==='checkbox'?el.checked:clean(el.value)):''; };
  const p={n:g('n').slice(0,40),s:g('s').slice(0,60),role:g('role').slice(0,40),meta:g('meta').slice(0,80),bio:g('bio').slice(0,300),bk:g('bk').slice(0,40),img:/^(https:\/\/|data:image\/(jpeg|png|webp);base64,)/.test(g('img'))?g('img'):'',live:g('live').slice(0,90),fem:!!g('fem')};
  if(g('k0')) p.k=[g('k0').slice(0,12),g('k1').slice(0,30)];
  if(g('d0')) p.deal=[g('d0').slice(0,40),g('d1').slice(0,60),g('d2').slice(0,20)];
  p.offers=readOffers().filter(o=>o.t).slice(0,MAXO);
  return p;
}
function pickPhoto(inp){
  const f=inp.files&&inp.files[0]; if(!f) return; if(!/^image\//.test(f.type)) return toast('Bitte ein Bild auswählen');
  const img=new Image(), url=URL.createObjectURL(f);
  img.onload=()=>{ const S=320, c=document.createElement('canvas'); c.width=c.height=S; const m=Math.min(img.width,img.height);
    c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S); URL.revokeObjectURL(url);
    const d=c.toDataURL('image/jpeg',.82); document.querySelector('[data-f="img"]').value=d; const pv=$('p-img'); pv.src=d; pv.style.visibility=''; toast('Foto übernommen. Sende die Änderung, damit es gespeichert wird.'); };
  img.onerror=()=>{ URL.revokeObjectURL(url); toast('Das Bild konnte nicht gelesen werden'); };
  img.src=url;
}
async function sendProfile(b){
  const p=readProfile(); if(!p.n||!p.s) return toast('Bitte Name und „Wofür du Partner bist“ ausfüllen');
  b.disabled=true;
  try{ const j=await api('rpc/partner_vorschlag',{method:'POST',body:{p}}); if(!j||!j.ok) throw new Error('Senden nicht möglich'); ME.draft=p; render(); toast('Gesendet. ClosingHub prüft deine Änderung.'); }
  catch(e){ toast('Das hat nicht geklappt: '+e.message); b.disabled=false; }
}
const guestLink=t=>'https://www.getclosinghub.com/?gast='+t;
const deDate=d=>{ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||''); return m?`${m[3]}.${m[2]}.${m[1]}`:''; };
function guestRow(slot){
  const g=GUESTS.find(x=>x.slot===slot)||{}, st=g.free_until?`kostenlos bis ${deDate(g.free_until)}`:(g.status||'frei');
  return `<div class="guest"><div class="row" style="justify-content:space-between"><b>Gast ${slot}</b><span class="pill ${g.status==='eingelöst'?'ok':g.token?'wait':''}">${esc(st)}</span></div>
    <div class="grid" style="margin-top:8px"><label class="f">Name<input class="in" id="g-n-${slot}" value="${esc(g.name||'')}"></label><label class="f">E-Mail-Adresse<input class="in" type="email" id="g-e-${slot}" value="${esc(g.email||'')}"></label></div>
    <div class="row" style="margin-top:10px"><button class="btn sm go" onclick="invite(${slot},'mail')">Einladung senden</button><button class="btn sm" onclick="invite(${slot},'copy')">Link kopieren</button>${g.token&&!g.free_until?`<button class="btn sm" onclick="removeGuest(${slot})">Entfernen</button>`:''}</div></div>`;
}
async function invite(slot,how){
  const name=clean($('g-n-'+slot).value).slice(0,60), email=clean($('g-e-'+slot).value).slice(0,120).toLowerCase();
  if(!name) return toast('Bitte den Namen eintragen');
  if(how==='mail'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('Bitte eine gültige E-Mail-Adresse eintragen');
  let g;
  try{ const rows=await api('partner_guests?on_conflict=partner_id,slot',{method:'POST',prefer:'resolution=merge-duplicates,return=representation',body:{partner_id:String(ME.id),slot,name,email:email||null}}); g=rows&&rows[0]; }
  catch(e){ return toast('Das hat nicht geklappt: '+e.message); }
  if(!g) return;
  GUESTS=GUESTS.filter(x=>x.slot!==slot).concat(g); const link=guestLink(g.token), keepP=readProfile(); ME._edit=keepP; render();
  if(how==='copy'){ try{ await navigator.clipboard.writeText(link); toast('Einladungslink kopiert'); }catch(e){ prompt('Einladungslink:',link); } return; }
  const me=(ME.profile&&ME.profile.n)||'Ich';
  const body=`Hallo ${name},\n\nich bin offizieller Partner von ClosingHub und lade dich als meinen Gast ein. Damit bekommst du die Plus-Mitgliedschaft kostenlos, solange meine Partnerschaft besteht.\n\nDein persönlicher Link:\n${link}\n\nÜber den Link trägst du dich mit deiner E-Mail-Adresse ein. Dein Gast-Platz ist dann für dich vorgemerkt.\n\nViele Grüße\n${me}`;
  location.href='mailto:'+encodeURIComponent(email)+'?subject='+encodeURIComponent('Deine Einladung zu ClosingHub')+'&body='+encodeURIComponent(body);
}
async function removeGuest(slot){
  if(!confirm('Diesen Gast wirklich entfernen? Der Einladungslink wird damit ungültig.')) return;
  try{ await api(`partner_guests?slot=eq.${slot}`,{method:'DELETE'}); GUESTS=GUESTS.filter(x=>x.slot!==slot); render(); toast('Gast entfernt'); }catch(e){ toast('Das hat nicht geklappt: '+e.message); }
}

async function render(){
  $('out').style.display=SESSION?'':'none';
  if(!SESSION){ if(!render._inv){ render._inv=true; await checkInvite(); } $('main').innerHTML=authView(); return; }
  if(ME===null && !render._loaded){ $('main').innerHTML='<p class="sub" style="margin-top:30px">Lade …</p>'; try{ await load(); render._loaded=true; }catch(e){ if(!SESSION) return render(); $('main').innerHTML=`<div class="note bad">Daten konnten nicht geladen werden: ${esc(e.message)}</div><p><button class="btn" onclick="location.reload()">Nochmal versuchen</button></p>`; return; } }
  if(ME&&ME._edit){ const keepP=ME._edit; delete ME._edit; const d=ME.draft; ME.draft=keepP; $('main').innerHTML=portal(); ME.draft=d; return; }
  $('main').innerHTML=portal();
}
render();
</script>
</body>
</html>
